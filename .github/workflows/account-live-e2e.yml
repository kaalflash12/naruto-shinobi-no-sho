name: Browser Account Live - Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'r41-api-config.js'
      - 'r41-github-api.js'
      - 'r41-account-ui.js'
      - 'src/r41-final-ui-repair.js'
      - 'index.html'
      - 'tools/browser-account-live.mjs'
      - '.github/workflows/account-live-e2e.yml'

permissions:
  contents: write

concurrency:
  group: shinobi-browser-account-supabase
  cancel-in-progress: false

jobs:
  browser-account:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for public Supabase build
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            cfg="$(curl -fsSL 'https://kaalflash12.github.io/naruto-shinobi-no-sho/r41-api-config.js?account-check='"$RANDOM" || true)"
            if printf '%s' "$cfg" | grep -q 'NARUTO-SHINOBI-NO-SHO-SUPABASE-POSTGRES'; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Browser account lifecycle
        id: account
        continue-on-error: true
        env:
          PUBLIC_GAME_URL: https://kaalflash12.github.io/naruto-shinobi-no-sho/
          BROWSER_ACCOUNT_REPORT: audit/BROWSER-ACCOUNT-LIVE.json
        run: node tools/browser-account-live.mjs

      - name: Commit browser account evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f audit/BROWSER-ACCOUNT-LIVE.json
          status="$(node -e "const r=require('./audit/BROWSER-ACCOUNT-LIVE.json');process.stdout.write(r.status||'UNKNOWN')")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/BROWSER-ACCOUNT-LIVE.json
          if ! git diff --cached --quiet; then
            git commit -m "test: browser account ${status}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce browser account PASS
        if: always()
        run: |
          node - <<'NODE'
          const r=require('./audit/BROWSER-ACCOUNT-LIVE.json');
          if(!r.ok||r.status!=='PASS_BROWSER_ACCOUNT_LIVE'||r.backend!=='supabase-edge-postgres')throw new Error(JSON.stringify(r.failures||[]));
          const required=['publicAccountUiLoaded','supabaseBackendSelected','apiOriginConfigured','registerUi','recoveryCodeShown','sessionPersistsReload','accountButtonVisibleAfterReload','rotateRecoveryCodeUi','logoutUi','loginByEmailUi','deleteUi'];
          for(const k of required)if(r.checks?.[k]!==true)throw new Error(`browser account gate ausente: ${k}`);
          console.log(r.status);
          NODE
