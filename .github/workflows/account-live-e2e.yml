name: Account Live E2E - Cloudflare MongoDB

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shinobi-account-live-e2e
  cancel-in-progress: true

jobs:
  account-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIVE_API_ORIGIN: ${{ vars.LIVE_API_ORIGIN }}
      PUBLIC_GAME_URL: https://kaalflash12.github.io/naruto-shinobi-no-sho/
      ACCOUNT_REPORT: audit/ACCOUNT-LIVE-E2E.json
      BROWSER_ACCOUNT_REPORT: audit/BROWSER-ACCOUNT-LIVE.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve verified Cloudflare Worker URL
        shell: bash
        run: |
          set -euo pipefail
          api="${LIVE_API_ORIGIN:-}"
          if [ -z "$api" ]; then
            api="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';const s=fs.readFileSync('r41-api-config.js','utf8');process.stdout.write(String(s.match(/const baked="([^"]*)"/)?.[1]||''));
          NODE
          )"
          fi
          api="${api%/}"
          test -n "$api" || { echo 'Worker verificado ainda não foi gravado em r41-api-config.js.' >&2; exit 1; }
          [[ "$api" =~ ^https:// ]] || exit 1
          if [[ "$api" =~ (supabase|vercel|turso) ]]; then echo 'Backend proibido.' >&2; exit 1; fi
          echo "API_ORIGIN=$api" >> "$GITHUB_ENV"
      - name: Require fresh live backend fingerprint
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(node tools/live-source-fingerprint.mjs)"
          test "${#fingerprint}" -eq 64
          SOURCE_FINGERPRINT="$fingerprint" node - <<'NODE'
          const fs=require('fs');
          const live=JSON.parse(fs.readFileSync('audit/LIVE-BACKEND.json','utf8'));
          const current=String(process.env.SOURCE_FINGERPRINT||'').trim();
          const api=String(process.env.API_ORIGIN||'').replace(/\/+$/,'');
          const cfg=fs.readFileSync('r41-api-config.js','utf8');
          const baked=String(cfg.match(/const baked="([^"]*)"/)?.[1]||'').replace(/\/+$/,'');
          if(!/^[a-f0-9]{64}$/.test(current))throw new Error('ACCOUNT_CURRENT_SOURCE_FINGERPRINT_INVALID');
          if(live?.ok!==true||live?.status!=='PASS_LIVE_BACKEND_E2E')throw new Error(`ACCOUNT_LIVE_BACKEND_NOT_PASS ${live?.status||'null'}`);
          if(String(live?.sourceFingerprint||'')!==current)throw new Error('ACCOUNT_LIVE_BACKEND_STALE');
          if(!api||!baked||api!==baked)throw new Error(`ACCOUNT_WORKER_MISMATCH baked=${baked||'null'} api=${api||'null'}`);
          NODE
          echo "SOURCE_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
      - name: Syntax gates
        run: |
          node --check r41-api-config.js
          node --check r41-github-api.js
          node --check r41-account-ui.js
          node --check tools/account-live-e2e.mjs
          node --check tools/browser-account-live.mjs
          node --check tools/live-source-fingerprint.mjs
      - name: Backend account lifecycle live
        run: node tools/account-live-e2e.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser account lifecycle on public site
        run: node tools/browser-account-live.mjs
      - name: Bind account evidence to live backend fingerprint
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const fingerprint=String(process.env.SOURCE_FINGERPRINT||'').trim();
          const apiOrigin=String(process.env.API_ORIGIN||'').trim().replace(/\/+$/,'');
          if(!/^[a-f0-9]{64}$/.test(fingerprint))throw new Error('ACCOUNT_PROVENANCE_FINGERPRINT_INVALID');
          if(!/^https:\/\//i.test(apiOrigin))throw new Error('ACCOUNT_PROVENANCE_API_INVALID');
          const specs=[
            ['audit/ACCOUNT-LIVE-E2E.json','PASS_ACCOUNT_LIVE_E2E','ACCOUNT_LIVE_CLOUDFLARE_MONGODB'],
            ['audit/BROWSER-ACCOUNT-LIVE.json','PASS_BROWSER_ACCOUNT_LIVE','BROWSER_ACCOUNT_LIVE_CLOUDFLARE_MONGODB']
          ];
          for(const [p,status,kind] of specs){
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            if(r?.ok!==true||r?.status!==status)throw new Error(`ACCOUNT_PROVENANCE_REPORT_NOT_PASS ${p} ${r?.status||'null'}`);
            const reportApi=String(r?.apiOrigin||'').replace(/\/+$/,'');
            if(reportApi!==apiOrigin)throw new Error(`ACCOUNT_PROVENANCE_API_MISMATCH ${p}`);
            r.provenance={kind,sourceFingerprint:fingerprint,apiOrigin,backend:'cloudflare-workers-mongodb-atlas',realtime:'cloudflare-durable-objects',buildAuthority:'R41-AUTHORITATIVE-TERION-20260823-V6'};
            fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          }
          NODE
      - name: Enforce account PASS reports
        run: |
          node - <<'NODE'
          const a=require('./audit/ACCOUNT-LIVE-E2E.json'),b=require('./audit/BROWSER-ACCOUNT-LIVE.json');
          if(!a.ok||a.status!=='PASS_ACCOUNT_LIVE_E2E'||a.backend!=='cloudflare-workers-mongodb-atlas')throw new Error(JSON.stringify(a.failures||[]));
          if(!b.ok||b.status!=='PASS_BROWSER_ACCOUNT_LIVE'||b.backend!=='cloudflare-workers-mongodb-atlas')throw new Error(JSON.stringify(b.failures||[]));
          const fingerprint=String(process.env.SOURCE_FINGERPRINT||'').trim();
          const api=String(process.env.API_ORIGIN||'').replace(/\/+$/,'');
          if(!/^[a-f0-9]{64}$/.test(fingerprint))throw new Error('ACCOUNT_SOURCE_FINGERPRINT_INVALID');
          for(const [name,r,kind] of [['backend',a,'ACCOUNT_LIVE_CLOUDFLARE_MONGODB'],['browser',b,'BROWSER_ACCOUNT_LIVE_CLOUDFLARE_MONGODB']]){
            if(r.provenance?.kind!==kind)throw new Error(`${name} provenance kind inválido`);
            if(r.provenance?.sourceFingerprint!==fingerprint)throw new Error(`${name} sourceFingerprint stale`);
            if(String(r.provenance?.apiOrigin||'').replace(/\/+$/,'')!==api)throw new Error(`${name} apiOrigin provenance mismatch`);
            if(r.provenance?.backend!=='cloudflare-workers-mongodb-atlas'||r.provenance?.realtime!=='cloudflare-durable-objects'||r.provenance?.buildAuthority!=='R41-AUTHORITATIVE-TERION-20260823-V6')throw new Error(`${name} provenance backend inválida`);
          }
          const backend=['apiOriginConfigured','backendStatus','mongodbAtlas','durableObjects','register','meAfterRegister','saveMongo','logout','loginByUsername','rotateRecoveryCode','recoverPassword','oldPasswordRejected','loginAfterRecovery','saveSurvivesRelogin','deleteSave','deleteAccount','deletedAccountRejected'];
          const browser=['publicAccountUiLoaded','cloudflareBackendSelected','apiOriginConfigured','registerUi','recoveryCodeShown','sessionPersistsReload','accountButtonVisibleAfterReload','rotateRecoveryCodeUi','logoutUi','loginByEmailUi','deleteUi'];
          for(const k of backend)if(a.checks?.[k]!==true)throw new Error(`backend gate ausente: ${k}`);
          for(const k of browser)if(b.checks?.[k]!==true)throw new Error(`browser gate ausente: ${k}`);
          console.log(a.status,b.status,'sourceFingerprint=',fingerprint);
          NODE
      - name: Upload account evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-account-cloudflare-mongodb-evidence
          path: |
            audit/ACCOUNT-LIVE-E2E.json
            audit/BROWSER-ACCOUNT-LIVE.json
          if-no-files-found: warn
      - name: Commit account evidence
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/ACCOUNT-LIVE-E2E.json audit/BROWSER-ACCOUNT-LIVE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(auth): record Cloudflare MongoDB account evidence'
          git pull --rebase origin main
          git push origin HEAD:main
