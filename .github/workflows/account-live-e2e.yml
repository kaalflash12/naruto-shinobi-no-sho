name: Account Live E2E

on:
  push:
    branches: [main]
    paths:
      - 'r41-api-config.js'
      - 'r41-github-api.js'
      - 'r41-account-ui.js'
      - 'index.html'
      - 'tools/account-live-e2e.mjs'
      - 'tools/browser-account-live.mjs'
      - '.github/workflows/account-live-e2e.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shinobi-account-live-e2e
  cancel-in-progress: true

jobs:
  account-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AUTH_ORIGIN: https://rlyiwlwzrdgvcwawrnpl.supabase.co/functions/v1/shinobi-auth
      API_ORIGIN: https://rlyiwlwzrdgvcwawrnpl.supabase.co/functions/v1/shinobi-api
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_S9LtSpLhLKFOU9iSd8b4yQ_EziH1Arr
      PUBLIC_GAME_URL: https://kaalflash12.github.io/naruto-shinobi-no-sho/
      ACCOUNT_REPORT: audit/ACCOUNT-LIVE-E2E.json
      BROWSER_ACCOUNT_REPORT: audit/BROWSER-ACCOUNT-LIVE.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax gates
        run: |
          node --check r41-api-config.js
          node --check r41-github-api.js
          node --check r41-account-ui.js
          node --check tools/account-live-e2e.mjs
          node --check tools/browser-account-live.mjs

      - name: Backend account lifecycle live
        run: node tools/account-live-e2e.mjs

      - name: Install Chromium in GitHub runner only
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages to publish account UI
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 80); do
            if curl -fsSL --max-time 15 "https://kaalflash12.github.io/naruto-shinobi-no-sho/r41-account-ui.js?cb=$(date +%s)-$i" | grep -q 'ACCOUNT-UI-20260822-V1'; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ "$ok" -ne 1 ]; then
            echo 'GitHub Pages nao publicou r41-account-ui.js a tempo.'
            exit 1
          fi

      - name: Browser account lifecycle on public site
        run: node tools/browser-account-live.mjs

      - name: Enforce account PASS reports
        run: |
          node - <<'NODE'
          const a=require('./audit/ACCOUNT-LIVE-E2E.json');
          const b=require('./audit/BROWSER-ACCOUNT-LIVE.json');
          if(!a.ok || a.status!=='PASS_ACCOUNT_LIVE_E2E') throw new Error('backend account E2E sem PASS');
          if(!b.ok || b.status!=='PASS_BROWSER_ACCOUNT_LIVE') throw new Error('browser account E2E sem PASS');
          const backend=['authStatus','register','meAfterRegister','sharedSessionWithGameApi','logout','loginByUsername','rotateRecoveryCode','recoverPassword','oldPasswordRejected','loginByEmailAfterRecovery','saveSurvivesRelogin','deleteAccount','deletedAccountRejected'];
          const browser=['publicAccountUiLoaded','registerUi','sessionPersistsReload','logoutUi','loginUi','deleteUi'];
          for(const k of backend)if(a.checks?.[k]!==true)throw new Error(`backend gate ausente: ${k}`);
          for(const k of browser)if(b.checks?.[k]!==true)throw new Error(`browser gate ausente: ${k}`);
          console.log(a.status,b.status);
          NODE

      - name: Upload account evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-account-live-evidence
          path: |
            audit/ACCOUNT-LIVE-E2E.json
            audit/BROWSER-ACCOUNT-LIVE.json
          if-no-files-found: warn

      - name: Commit account evidence
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/ACCOUNT-LIVE-E2E.json audit/BROWSER-ACCOUNT-LIVE.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No account evidence changes.'
          else
            git commit -m 'test(auth): record live account evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi