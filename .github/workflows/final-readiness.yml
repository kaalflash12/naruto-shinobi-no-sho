name: Final Readiness

on:
  push:
    branches: [main]
    paths:
      - 'tools/final-readiness.mjs'
      - 'r41-api-config.js'
      - 'r41-github-api.js'
      - 'audit/LIVE-BACKEND.json'
      - 'audit/BROWSER-LIVE-API.json'
      - 'audit/ACCOUNT-LIVE-E2E.json'
      - 'audit/BROWSER-ACCOUNT-LIVE.json'
      - 'audit/BROWSER-SMOKE.json'
      - 'audit/BROWSER-GAMEPLAY-E2E.json'
      - 'docs/generated/FINAL-CANONICAL-AUDIT.json'
      - 'docs/generated/DOCUMENTATION-AUDIT.json'
      - 'docs/generated/OPERATIONAL-STATIC-AUDIT.json'
      - '.github/workflows/final-readiness.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shinobi-final-readiness
  cancel-in-progress: true

jobs:
  final-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate backend identity and gate syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/final-readiness.mjs
          node --check r41-api-config.js
          node --check r41-github-api.js
          grep -F 'NARUTO-SHINOBI-NO-SHO-CLOUDFLARE-MONGODB' r41-api-config.js
          grep -F 'cloudflare-mongodb-durable-objects' r41-github-api.js
          if grep -Eiq '(supabase|vercel|turso)' r41-api-config.js r41-github-api.js; then
            echo 'Backend proibido permanece no runtime ativo.' >&2
            exit 1
          fi
      - name: Run final all-systems gate
        run: node tools/final-readiness.mjs
      - name: Enforce PASS_FINAL_READINESS
        run: |
          node - <<'NODE'
          const r=require('./audit/FINAL-READINESS.json');
          if(!r.ok||r.status!=='PASS_FINAL_READINESS')throw new Error(JSON.stringify(r.failures||[]));
          for(const [k,v] of Object.entries({liveBackend:'PASS_LIVE_BACKEND_E2E',browserLive:'PASS_BROWSER_LIVE_API',accountLive:'PASS_ACCOUNT_LIVE_E2E',browserAccount:'PASS_BROWSER_ACCOUNT_LIVE',gameplay:'PASS_BROWSER_GAMEPLAY_E2E'}))if(r.gates?.[k]!==v)throw new Error(`${k} sem ${v}`);
          if(!String(r.stack||'').includes('Cloudflare Workers')||!String(r.stack||'').includes('MongoDB Atlas'))throw new Error('stack final incorreto');
          console.log(r.status,r.gates);
          NODE
      - name: Upload final readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-final-readiness
          path: audit/FINAL-READINESS.json
          if-no-files-found: warn
      - name: Commit final readiness evidence
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/FINAL-READINESS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: record PASS_FINAL_READINESS Cloudflare MongoDB'
          git pull --rebase origin main
          git push origin HEAD:main
