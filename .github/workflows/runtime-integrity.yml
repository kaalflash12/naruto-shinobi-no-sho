name: Integridade do runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pinned repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Validate JavaScript syntax and TERION unit contracts
        run: npm run check:runtime

      - name: Validate physical asset paths
        run: npm run check:assets

      - name: Validate public product identity
        shell: bash
        run: |
          grep -F '<title>NARUTO SHINOBI NO SHO • TERION 2D10</title>' index.html
          grep -F 'name = "naruto-shinobi-no-sho-api"' cloudflare/r41-api/wrangler.toml
          grep -F 'main = "src/entry-authoritative.js"' cloudflare/r41-api/wrangler.toml
          grep -F 'MONGODB_DB = "naruto_shinobi_no_sho"' cloudflare/r41-api/wrangler.toml
          ! grep -Eqi 'naruto[ -]?unison' index.html r41-api-config.js cloudflare/r41-api/src/entry.js cloudflare/r41-api/src/entry-authoritative.js cloudflare/r41-api/src/index.js
          ! grep -Eqi 'supabase|vercel' r41-api-config.js r41-github-api.js r41-account-ui.js cloudflare/r41-api/src/entry.js cloudflare/r41-api/src/entry-authoritative.js cloudflare/r41-api/src/index.js

      - name: Validate Cloudflare Mongo auth runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'no_throw_on_not_implemented_tls_options' cloudflare/r41-api/wrangler.toml
          grep -F 'requestMongoDb' cloudflare/r41-api/src/index.js
          grep -F 'requestMongoDb' cloudflare/r41-api/src/entry.js
          grep -F 'createMongoRequestEnv' cloudflare/r41-api/src/entry-authoritative.js
          grep -F 'closeMongoRequestEnv' cloudflare/r41-api/src/entry-authoritative.js
          grep -F 'finally{' cloudflare/r41-api/src/entry-authoritative.js
          grep -F 'await closeMongoRequestEnv(requestEnv)' cloudflare/r41-api/src/entry-authoritative.js
          grep -F 'code!==26&&code!==27' cloudflare/r41-api/src/entry-authoritative.js
          grep -F 'NamespaceNotFound' cloudflare/r41-api/src/entry-authoritative.js
          grep -F 'export const R41_MONGO_REQUEST_SCOPE' cloudflare/r41-api/src/mongo-request.js
          grep -F 'const client=new MongoClient' cloudflare/r41-api/src/mongo-request.js
          grep -F 'scope.clients.push(client)' cloudflare/r41-api/src/mongo-request.js
          grep -F 'clients.map(client=>client.close())' cloudflare/r41-api/src/mongo-request.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const paths=[
            'cloudflare/r41-api/src/index.js',
            'cloudflare/r41-api/src/entry.js'
          ];
          for(const path of paths){
            const src=fs.readFileSync(path,'utf8');
            const values=[];
            for(const re of [
              /hashPassword\([^)]*iterations\s*=\s*(\d+)/g,
              /(?:passIter|iterations)\s*:\s*(\d+)/g,
              /hashPassword\([^\n;]*?,\s*(\d+)\s*\)/g
            ]){
              for(const m of src.matchAll(re)) values.push(Number(m[1]));
            }
            if(values.some(v=>v>100000)) throw new Error(`${path}: PBKDF2 acima de 100000: ${values.join(',')}`);
          }
          const mongo=fs.readFileSync('cloudflare/r41-api/src/mongo-request.js','utf8');
          if(!mongo.includes('createMongoRequestEnv')||!mongo.includes('closeMongoRequestEnv')) throw new Error('request-scoped Mongo helper incompleto');
          const authority=fs.readFileSync('cloudflare/r41-api/src/entry-authoritative.js','utf8');
          if(!authority.includes('const requestEnv=createMongoRequestEnv(env)')) throw new Error('requestEnv nao criado por request');
          if(!authority.includes('await closeMongoRequestEnv(requestEnv)')) throw new Error('requestEnv nao fechado no finally');
          console.log('PASS_CLOUDFLARE_MONGO_AUTH_RUNTIME_CONTRACTS');
          NODE

      - name: Validate anti-exploit gameplay contracts in source
        shell: bash
        run: |
          grep -F "if(!long&&now-Number(rec.lastShortRestAbs||-999999)<60)" app.js
          grep -F "if(long&&now-Number(rec.lastLongRestAbs||-999999)<480)" app.js
          grep -F "const cap=r41PersistentRecoveryCap(c)" app.js
          grep -F "c.kusenroChakra=before.kusenro" app.js
          grep -F "if(c.kurai)c.kurai.chakra=before.kurai" app.js
          grep -F "const gainXpR41Base=gainXp" app.js
          grep -F "r41ScheduleCloudSave" app.js
          grep -F "r41HospitalTreat" app.js
          grep -F "r41OpenMinigame" app.js
          grep -F "r41SendOnlineIntent" app.js
          grep -F 'R41-AUTHORITATIVE-TERION-20260823-V6' cloudflare/r41-api/src/entry-authoritative.js
          grep -F "CLIENT_MECHANICAL_RESULT_FORBIDDEN" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "resolveTerionIntent" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "trustedProfile" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "trustedCharacter" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "mechanical_profiles" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "profileKeyFor" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "matchingSave" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "seedMechanicalProfile" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "lockedMechanicalProfile" cloudflare/r41-api/src/entry-authoritative.js
          grep -F 'createIndex({userId:1,profileKey:1},{unique:true,name:"uq_mechanical_profile_user_key"})' cloudflare/r41-api/src/entry-authoritative.js
          grep -F 'dropIndex("uq_mechanical_profile_user")' cloudflare/r41-api/src/entry-authoritative.js
          grep -F "delete safe.character" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "AUTHORITATIVE_CHARACTER_SAVE_REQUIRED" cloudflare/r41-api/src/entry-authoritative.js
          grep -F 'difficulty:"normal"' cloudflare/r41-api/src/entry-authoritative.js
          grep -F "clientRoomCharacterIgnored=true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "mechanicsReadFromMongoProfile=true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "mechanicalProfilesPerCharacter=true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "mechanicalProfileIndexMigrationV6=true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "mechanicalBaselineSeededFromMatchingSave=true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "clientAutosaveCannotOverwriteMechanicalProfile=true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "leaderboardUsesMechanicalProfiles=true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "profilesPerCharacter:true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "authoritativeLeaderboard" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "clientSaveRankIgnored:true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "authoritativeSlotDelete" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "mechanicalProfileSlotCleanup=true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "slotDeleteCleansMechanicalProfile=true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "authoritativeWorld" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "stripClientMechanical" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "worldMechanicalPayloadSanitized=true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "worldSavepointCharacterFromMechanicalProfile=true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "authoritativeWorldPersistence:true" cloudflare/r41-api/src/entry-authoritative.js
          grep -F "room.internal/action" cloudflare/r41-api/src/entry-authoritative.js
          grep -F '"hp","pv","health","chakra"' cloudflare/r41-api/src/terion-mechanics.js
          grep -F '"stats","attributes","atributos","inventory","inventario"' cloudflare/r41-api/src/terion-mechanics.js
          grep -F "export function stripClientMechanical" cloudflare/r41-api/src/terion-mechanics.js
          grep -F "PASS_TERION_SERVER_AUTHORITY_UNIT" cloudflare/r41-api/test/terion-mechanics.test.mjs

      - name: Validate full documentation and operational gates
        run: npm run docs:check
