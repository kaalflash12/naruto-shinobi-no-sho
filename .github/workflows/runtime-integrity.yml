name: Integridade do runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate JavaScript syntax and TERION unit contracts
        run: npm run check:runtime

      - name: Validate physical asset paths
        run: npm run check:assets

      - name: Validate public product identity and canonical backend
        shell: bash
        run: |
          set -euo pipefail
          grep -F '<title>NARUTO SHINOBI NO SHO • TERION 2D10</title>' index.html
          grep -F 'https://rlyiwlwzrdgvcwawrnpl.supabase.co/functions/v1/shinobi-api' r41-api-config.js
          grep -F 'NARUTO-SHINOBI-NO-SHO-SUPABASE-POSTGRES' r41-api-config.js
          grep -F 'window.NARUTO_R41_SUPABASE_PUBLISHABLE_KEY=SUPABASE_KEY' r41-api-config.js
          grep -F 'headers.set("apikey",key)' r41-github-api.js
          grep -F 'headers.set("authorization",`Bearer ${t}`)' r41-github-api.js
          grep -F 'backend(){return apiOrigin()?"supabase-edge-postgres":"unconfigured"' r41-github-api.js
          ! grep -Eqi 'naruto[ -]?unison' index.html r41-api-config.js r41-github-api.js r41-account-ui.js
          ! grep -Eqi 'workers\.dev|mongodb|d1_database|cloudflare' r41-api-config.js r41-github-api.js r41-account-ui.js

      - name: Validate anti-exploit gameplay contracts in client source
        shell: bash
        run: |
          set -euo pipefail
          grep -F "if(!long&&now-Number(rec.lastShortRestAbs||-999999)<60)" app.js
          grep -F "if(long&&now-Number(rec.lastLongRestAbs||-999999)<480)" app.js
          grep -F "const cap=r41PersistentRecoveryCap(c)" app.js
          grep -F "c.kusenroChakra=before.kusenro" app.js
          grep -F "if(c.kurai)c.kurai.chakra=before.kurai" app.js
          grep -F "const gainXpR41Base=gainXp" app.js
          grep -F "r41ScheduleCloudSave" app.js
          grep -F "r41HospitalTreat" app.js
          grep -F "r41OpenMinigame" app.js
          grep -F "r41SendOnlineIntent" app.js

      - name: Validate Supabase live authority contract exercised by E2E
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/supabase-live-e2e.mjs
          grep -F "status.data.storage==='supabase-postgres'" tools/supabase-live-e2e.mjs
          grep -F "unauth.status===401" tools/supabase-live-e2e.mjs
          grep -F "loaded.data?.save?.character?.kurai?.chakra===8" tools/supabase-live-e2e.mjs
          grep -F "fake.status===400&&fake.data?.error==='CLIENT_MECHANICAL_RESULT_FORBIDDEN'" tools/supabase-live-e2e.mjs
          grep -F "intent.data?.accepted===true" tools/supabase-live-e2e.mjs
          grep -F "world.data?.event?.minutes===20" tools/supabase-live-e2e.mjs
          grep -F "sp.data?.savepoint?.id" tools/supabase-live-e2e.mjs
          grep -F "ai.data?.authority==='TERION_RESOLVES_MECHANICS'" tools/supabase-live-e2e.mjs
          grep -F "live.status!=='PASS_LIVE_BACKEND_E2E'" .github/workflows/live-backend-e2e.yml
          grep -F "live.backend!=='supabase-edge-postgres'" .github/workflows/live-backend-e2e.yml
          grep -F "account.status!=='PASS_ACCOUNT_LIVE_E2E'" .github/workflows/live-backend-e2e.yml

      - name: Validate full documentation and operational gates
        run: npm run docs:check
