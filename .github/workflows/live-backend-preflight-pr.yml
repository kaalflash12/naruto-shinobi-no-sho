name: Live Backend Preflight PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Worker dependencies
        working-directory: cloudflare/r41-api
        run: npm install --no-audit --no-fund

      - name: Static Worker syntax gate
        working-directory: cloudflare/r41-api
        run: npm run check

      - name: Wrangler dry-run gate
        working-directory: cloudflare/r41-api
        run: npx wrangler deploy --dry-run --outdir /tmp/shinobi-worker-dry

      - name: Verify required secret names without exposing values
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MONGODB_URI AUTH_SECRET; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "MISSING_SECRET_NAMES=$(IFS=,; echo "${missing[*]}")"
            exit 1
          fi
          echo "LIVE_SECRET_NAMES_PRESENT=true"
