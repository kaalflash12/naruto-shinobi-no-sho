name: Canonical V3 Hardening

on:
  push:
    branches:
      - main
    paths:
      - tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1
      - ATIVAR-CLOUDFLARE-LIVE.ps1
      - .github/workflows/canonical-v3-hardening.yml
  pull_request:
    paths:
      - tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1
      - ATIVAR-CLOUDFLARE-LIVE.ps1
      - .github/workflows/canonical-v3-hardening.yml

permissions:
  contents: read

jobs:
  validate-canonical-v3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse canonical V3 and regression fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Canonical V3 parse failed with $($errors.Count) error(s)."
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $path -ValidateRunParsing
          if ($LASTEXITCODE -ne 0) { throw "Canonical V3 regression fixture failed with exit code $LASTEXITCODE." }

      - name: Enforce Cloudflare and Atlas hardening contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $canonical = Get-Content 'tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1' -Raw
          $required = @(
            "login --device | Out-Host",
            "auth login --force --skipConfig --noBrowser",
            "run watch `$RunId --repo `$Repo --exit-status | Out-Host",
            "workflow run backend-secret-presence.yml --repo `$Repo --ref main *> `$null",
            "workflow run final-readiness-orchestration.yml --repo `$Repo --ref main *> `$null",
            'function Test-AtlasAuthenticated([string]$Atlas)',
            'function Invoke-AtlasCli([string]$Atlas, [string[]]$Arguments, [switch]$AllowFailure)',
            "if (Test-AtlasAuthenticated `$Atlas) { return }",
            "if (-not (Test-AtlasAuthenticated `$Atlas)) { throw 'MongoDB Atlas CLI nao ficou autenticado.' }",
            "`$project = @(`$projects | Where-Object { ([string]`$_.name) -eq 'naruto-shinobi-no-sho' }) | Select-Object -First 1",
            "`$cluster = @(`$clusters | Where-Object { ([string]`$_.name) -eq 'shinobi-no-sho' }) | Select-Object -First 1",
            "Invoke-AtlasCli `$atlas @('accessLists','list','--projectId',`$projectId,'--limit','500','--output','json')",
            "Invoke-AtlasCli `$atlas @('dbusers','update',`$username,'--password',`$password,'--projectId',`$projectId) -AllowFailure",
            'Cluster MongoDB Atlas nao ficou pronto. Estado final:',
            "`$finalReadinessPassed = `$false",
            "`$finalReadinessPassed = `$true",
            "`$temporaryCloudflareSecretWritten -and `$finalReadinessPassed"
          )
          foreach ($needle in $required) {
            if (-not $canonical.Contains($needle)) { throw "Canonical V3 hardening missing: $needle" }
          }

          $unsafe = @(
            '& $Atlas auth whoami *> $null',
            '$project = $projects | Select-Object -First 1',
            '$cluster = $clusters | Select-Object -First 1',
            '& $atlas dbusers update',
            '  if ($temporaryCloudflareSecretWritten) {'
          )
          foreach ($needle in $unsafe) {
            if ($canonical.Contains($needle)) { throw "Unsafe canonical V3 contract remains: $needle" }
          }
          Write-Host 'PASS_CANONICAL_V3_CLOUDFLARE_ATLAS_HARDENING'

      - name: Verify root launcher executes canonical V3 directly
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'ATIVAR-CLOUDFLARE-LIVE.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Root launcher parse failed with $($errors.Count) error(s)."
          }

          $launcher = Get-Content $path -Raw
          $required = @(
            'tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1',
            '[System.Management.Automation.Language.Parser]::ParseFile',
            'PASS_BOOTSTRAP_CANONICAL_V3_READY',
            '& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $target -Repo $Repo'
          )
          foreach ($needle in $required) {
            if (-not $launcher.Contains($needle)) { throw "Root launcher contract missing: $needle" }
          }
          if ($launcher.Contains('function Replace-Required')) { throw 'Obsolete text-patching layer remains in root launcher.' }
          if ($launcher.Contains('Hotfix atlas-setup-output')) { throw 'Obsolete Atlas hotfix contract remains in root launcher.' }
          Write-Host 'PASS_CANONICAL_V3_ROOT_LAUNCHER_DIRECT'
