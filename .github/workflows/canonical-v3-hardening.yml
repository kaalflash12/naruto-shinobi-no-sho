name: Canonical V3 Hardening

on:
  push:
    branches:
      - main
    paths:
      - tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1
      - ATIVAR-CLOUDFLARE-LIVE.ps1
      - .github/workflows/canonical-v3-hardening.yml
  pull_request:
    paths:
      - tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1
      - ATIVAR-CLOUDFLARE-LIVE.ps1
      - .github/workflows/canonical-v3-hardening.yml

permissions:
  contents: write

jobs:
  patch-and-validate-canonical-v3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Atlas authentication probe idempotently
        shell: python
        run: |
          from pathlib import Path

          path = Path('tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1')
          source = path.read_text(encoding='utf-8-sig')

          if 'function Test-AtlasAuthenticated([string]$Atlas)' in source:
              print('ATLAS_WINPS_HOTFIX_ALREADY_PRESENT')
              raise SystemExit(0)

          old_start = """function Ensure-AtlasLoginZeroPaste([string]$Atlas) {
            & $Atlas auth whoami *> $null
            if ($LASTEXITCODE -eq 0) { return }
          """
          new_start = """function Test-AtlasAuthenticated([string]$Atlas) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $Atlas
            $psi.Arguments = 'auth whoami'
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.CreateNoWindow = $true
            $p = New-Object System.Diagnostics.Process
            $p.StartInfo = $psi
            try {
              [void]$p.Start()
              [void]$p.StandardOutput.ReadToEnd()
              [void]$p.StandardError.ReadToEnd()
              $p.WaitForExit()
              return ($p.ExitCode -eq 0)
            } catch {
              return $false
            } finally {
              if ($p) { $p.Dispose() }
            }
          }

          function Ensure-AtlasLoginZeroPaste([string]$Atlas) {
            if (Test-AtlasAuthenticated $Atlas) { return }
          """
          if source.count(old_start) != 1:
              raise SystemExit(f'Atlas login start probe match count: {source.count(old_start)}')
          patched = source.replace(old_start, new_start, 1)

          old_tail = """  & $Atlas auth whoami *> $null
            if ($LASTEXITCODE -ne 0) { throw 'MongoDB Atlas CLI nao ficou autenticado.' }
          """
          new_tail = """  if (-not (Test-AtlasAuthenticated $Atlas)) { throw 'MongoDB Atlas CLI nao ficou autenticado.' }
          """
          if patched.count(old_tail) != 1:
              raise SystemExit(f'Atlas login final probe match count: {patched.count(old_tail)}')
          patched = patched.replace(old_tail, new_tail, 1)

          if 'auth login --force --skipConfig --noBrowser' not in patched:
              raise SystemExit('Fluxo Atlas zero-paste foi removido indevidamente.')
          path.write_text(patched, encoding='utf-8', newline='')
          print('PATCHED_CANONICAL_V3_ATLAS_WINPS')

      - name: Parse and run deterministic V3 regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Canonical V3 parse failed with $($errors.Count) error(s)."
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $path -ValidateRunParsing
          if ($LASTEXITCODE -ne 0) { throw "Canonical V3 regression fixture failed with exit code $LASTEXITCODE." }
          $canonical = Get-Content $path -Raw
          if (-not $canonical.Contains('function Test-AtlasAuthenticated([string]$Atlas)')) { throw 'Atlas safe probe helper missing.' }
          if (-not $canonical.Contains('if (Test-AtlasAuthenticated $Atlas) { return }')) { throw 'Atlas initial safe probe missing.' }
          if (-not $canonical.Contains("if (-not (Test-AtlasAuthenticated `$Atlas)) { throw 'MongoDB Atlas CLI nao ficou autenticado.' }")) { throw 'Atlas final safe probe missing.' }
          if ($canonical.Contains('& $Atlas auth whoami *> $null')) { throw 'Unsafe direct Atlas whoami probe remains.' }
          Write-Host 'PASS_CANONICAL_V3_ATLAS_WINPS_HARDENING'

      - name: Commit V3 hotfix when changed
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1
          if (git diff --cached --quiet) {
            Write-Host 'CANONICAL_V3_ALREADY_PATCHED'
            exit 0
          }
          git diff --cached --check
          git commit -m 'fix: make Atlas auth probe safe on Windows PowerShell'
          git pull --rebase origin main
          git push origin HEAD:main
