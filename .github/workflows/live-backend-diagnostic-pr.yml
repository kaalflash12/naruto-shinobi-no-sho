name: Cloudflare MongoDB Credential Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'audit/LIVE-BACKEND-DIAGNOSTIC.trigger'
      - '.github/workflows/live-backend-diagnostic-pr.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      LEON_PRIVATE_CODE: ${{ secrets.LEON_PRIVATE_CODE }}
      LIVE_API_ORIGIN: ${{ vars.LIVE_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required credentials without printing values
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MONGODB_URI AUTH_SECRET; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          echo "LEON_PRIVATE_CODE_PRESENT=$([ -n "${LEON_PRIVATE_CODE:-}" ] && echo true || echo false)"
          echo "LIVE_API_ORIGIN_PRESENT=$([ -n "${LIVE_API_ORIGIN:-}" ] && echo true || echo false)"
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "MISSING_REQUIRED=$(IFS=,; echo "${missing[*]}")" >&2
            exit 1
          fi
          echo 'PASS_REQUIRED_CLOUDFLARE_MONGODB_CREDENTIALS_PRESENT'
