name: Backend Secret Presence Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-secret-presence.yml'
      - '.github/workflows/live-backend-e2e.yml'
      - '.github/workflows/account-live-e2e.yml'
      - '.github/workflows/browser-gameplay-e2e.yml'
      - '.github/workflows/post-live-backend-orchestration.yml'
      - '.github/workflows/final-readiness-orchestration.yml'
      - '.github/workflows/final-readiness.yml'
      - 'cloudflare/r41-api/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'r31.css'
      - 'r41-map-hitfix.css'
      - 'r41-*.js'
      - 'data/**'
      - 'src/**'
      - 'assets/ui/logo.png'
      - 'tools/live-worker-e2e.mjs'
      - 'tools/browser-live-api.mjs'
      - 'tools/live-source-fingerprint.mjs'
      - 'tools/release-source-fingerprint.mjs'
      - 'tools/public-release-coherence.mjs'
      - 'tools/wait-public-release-coherence.mjs'
      - 'tools/account-live-e2e.mjs'
      - 'tools/browser-account-live.mjs'
      - 'tools/browser-gameplay-e2e-v4.mjs'
      - 'tools/gameplay-live-provenance.mjs'
      - 'tools/final-readiness-orchestration-gate.mjs'
      - 'tools/final-readiness.mjs'
      - 'tools/backend-presence-audit.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: shinobi-backend-secret-presence
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    env:
      SECRET_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SECRET_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SECRET_MONGODB_URI: ${{ secrets.MONGODB_URI }}
      SECRET_AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      SECRET_LEON_PRIVATE_CODE: ${{ secrets.LEON_PRIVATE_CODE }}
      VAR_CLOUDFLARE_API_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
      VAR_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VAR_MONGODB_URI: ${{ vars.MONGODB_URI }}
      VAR_AUTH_SECRET: ${{ vars.AUTH_SECRET }}
      VAR_LEON_PRIVATE_CODE: ${{ vars.LEON_PRIVATE_CODE }}
      VAR_LIVE_API_ORIGIN: ${{ vars.LIVE_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Compute backend and release fingerprints
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/live-source-fingerprint.mjs
          node --check tools/release-source-fingerprint.mjs
          node --check tools/backend-presence-audit.mjs
          live="$(node tools/live-source-fingerprint.mjs)"
          release="$(node tools/release-source-fingerprint.mjs)"
          test "${#live}" -eq 64
          test "${#release}" -eq 64
          echo "LIVE_SOURCE_FINGERPRINT=$live" >> "$GITHUB_ENV"
          echo "RELEASE_SOURCE_FINGERPRINT=$release" >> "$GITHUB_ENV"
          echo "CURRENT_LIVE_SOURCE_FINGERPRINT=$live"
          echo "CURRENT_RELEASE_SOURCE_FINGERPRINT=$release"

      - name: Record non-sensitive presence and freshness matrix
        id: presence
        run: node tools/backend-presence-audit.mjs

      - name: Commit audit when semantic state changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/BACKEND-SECRET-PRESENCE.json
          if git diff --cached --quiet; then
            echo 'BACKEND_PRESENCE_UNCHANGED'
            exit 0
          fi
          git commit -m 'test: record backend credential and evidence freshness matrix'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch live backend when credentials are ready and backend evidence is stale
        if: steps.presence.outputs.ready == 'true' && steps.presence.outputs.live_pass != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run live-backend-e2e.yml --repo kaalflash12/naruto-shinobi-no-sho --ref main
          echo 'DISPATCHED_LIVE_BACKEND_AFTER_REQUIRED_CREDENTIALS_OR_BACKEND_SOURCE_CHANGE'

      - name: Dispatch live consumers when backend is current but release evidence is stale
        if: steps.presence.outputs.live_pass == 'true' && steps.presence.outputs.consumers_pass != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run account-live-e2e.yml --repo kaalflash12/naruto-shinobi-no-sho --ref main
          gh workflow run browser-gameplay-e2e.yml --repo kaalflash12/naruto-shinobi-no-sho --ref main
          echo 'DISPATCHED_ACCOUNT_AND_GAMEPLAY_AFTER_RELEASE_SOURCE_CHANGE'
