name: Backend Secret Presence Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-secret-presence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      LEON_PRIVATE_CODE: ${{ secrets.LEON_PRIVATE_CODE }}
      LIVE_API_ORIGIN: ${{ vars.LIVE_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record non-sensitive presence matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const present=name=>Boolean(String(process.env[name]||'').trim());
          const matrix={
            CLOUDFLARE_API_TOKEN:present('CLOUDFLARE_API_TOKEN'),
            CLOUDFLARE_ACCOUNT_ID:present('CLOUDFLARE_ACCOUNT_ID'),
            MONGODB_URI:present('MONGODB_URI'),
            AUTH_SECRET:present('AUTH_SECRET'),
            LEON_PRIVATE_CODE:present('LEON_PRIVATE_CODE'),
            LIVE_API_ORIGIN:present('LIVE_API_ORIGIN')
          };
          fs.writeFileSync('audit/BACKEND-SECRET-PRESENCE.json',JSON.stringify({generatedAt:new Date().toISOString(),status:'BACKEND_SECRET_PRESENCE_ONLY',ok:true,present:matrix,note:'Somente booleanos de presença; nenhum valor secreto foi lido ou gravado.'},null,2)+'\n');
          NODE
      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/BACKEND-SECRET-PRESENCE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: record backend secret presence matrix'
          git pull --rebase origin main
          git push origin HEAD:main
