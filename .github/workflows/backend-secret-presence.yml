name: Backend Secret Presence Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-secret-presence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      SECRET_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SECRET_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SECRET_MONGODB_URI: ${{ secrets.MONGODB_URI }}
      SECRET_AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      SECRET_LEON_PRIVATE_CODE: ${{ secrets.LEON_PRIVATE_CODE }}
      VAR_CLOUDFLARE_API_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
      VAR_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VAR_MONGODB_URI: ${{ vars.MONGODB_URI }}
      VAR_AUTH_SECRET: ${{ vars.AUTH_SECRET }}
      VAR_LEON_PRIVATE_CODE: ${{ vars.LEON_PRIVATE_CODE }}
      VAR_LIVE_API_ORIGIN: ${{ vars.LIVE_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record non-sensitive presence matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const has=name=>Boolean(String(process.env[name]||'').trim());
          const secrets={
            CLOUDFLARE_API_TOKEN:has('SECRET_CLOUDFLARE_API_TOKEN'),
            CLOUDFLARE_ACCOUNT_ID:has('SECRET_CLOUDFLARE_ACCOUNT_ID'),
            MONGODB_URI:has('SECRET_MONGODB_URI'),
            AUTH_SECRET:has('SECRET_AUTH_SECRET'),
            LEON_PRIVATE_CODE:has('SECRET_LEON_PRIVATE_CODE')
          };
          const variables={
            CLOUDFLARE_API_TOKEN:has('VAR_CLOUDFLARE_API_TOKEN'),
            CLOUDFLARE_ACCOUNT_ID:has('VAR_CLOUDFLARE_ACCOUNT_ID'),
            MONGODB_URI:has('VAR_MONGODB_URI'),
            AUTH_SECRET:has('VAR_AUTH_SECRET'),
            LEON_PRIVATE_CODE:has('VAR_LEON_PRIVATE_CODE'),
            LIVE_API_ORIGIN:has('VAR_LIVE_API_ORIGIN')
          };
          const usable={
            CLOUDFLARE_API_TOKEN:secrets.CLOUDFLARE_API_TOKEN||variables.CLOUDFLARE_API_TOKEN,
            CLOUDFLARE_ACCOUNT_ID:secrets.CLOUDFLARE_ACCOUNT_ID||variables.CLOUDFLARE_ACCOUNT_ID,
            MONGODB_URI:secrets.MONGODB_URI||variables.MONGODB_URI,
            AUTH_SECRET:secrets.AUTH_SECRET||variables.AUTH_SECRET,
            LEON_PRIVATE_CODE:secrets.LEON_PRIVATE_CODE||variables.LEON_PRIVATE_CODE,
            LIVE_API_ORIGIN:variables.LIVE_API_ORIGIN
          };
          fs.writeFileSync('audit/BACKEND-SECRET-PRESENCE.json',JSON.stringify({generatedAt:new Date().toISOString(),status:'BACKEND_CREDENTIAL_PRESENCE_ONLY',ok:true,secrets,variables,usable,note:'Somente booleanos de presença; nenhum valor secreto ou variável foi gravado.'},null,2)+'\n');
          NODE
      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/BACKEND-SECRET-PRESENCE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: record backend credential presence matrix'
          git pull --rebase origin main
          git push origin HEAD:main
