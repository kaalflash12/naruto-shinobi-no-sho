name: Backend Secret Presence Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-secret-presence.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: shinobi-backend-secret-presence
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    env:
      SECRET_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SECRET_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SECRET_MONGODB_URI: ${{ secrets.MONGODB_URI }}
      SECRET_AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      SECRET_LEON_PRIVATE_CODE: ${{ secrets.LEON_PRIVATE_CODE }}
      VAR_CLOUDFLARE_API_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
      VAR_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VAR_MONGODB_URI: ${{ vars.MONGODB_URI }}
      VAR_AUTH_SECRET: ${{ vars.AUTH_SECRET }}
      VAR_LEON_PRIVATE_CODE: ${{ vars.LEON_PRIVATE_CODE }}
      VAR_LIVE_API_ORIGIN: ${{ vars.LIVE_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record non-sensitive presence matrix
        id: presence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const has=name=>Boolean(String(process.env[name]||'').trim());
          const secrets={
            CLOUDFLARE_API_TOKEN:has('SECRET_CLOUDFLARE_API_TOKEN'),
            CLOUDFLARE_ACCOUNT_ID:has('SECRET_CLOUDFLARE_ACCOUNT_ID'),
            MONGODB_URI:has('SECRET_MONGODB_URI'),
            AUTH_SECRET:has('SECRET_AUTH_SECRET'),
            LEON_PRIVATE_CODE:has('SECRET_LEON_PRIVATE_CODE')
          };
          const variables={
            CLOUDFLARE_API_TOKEN:has('VAR_CLOUDFLARE_API_TOKEN'),
            CLOUDFLARE_ACCOUNT_ID:has('VAR_CLOUDFLARE_ACCOUNT_ID'),
            MONGODB_URI:has('VAR_MONGODB_URI'),
            AUTH_SECRET:has('VAR_AUTH_SECRET'),
            LEON_PRIVATE_CODE:has('VAR_LEON_PRIVATE_CODE'),
            LIVE_API_ORIGIN:has('VAR_LIVE_API_ORIGIN')
          };
          const usable={
            CLOUDFLARE_API_TOKEN:secrets.CLOUDFLARE_API_TOKEN,
            CLOUDFLARE_ACCOUNT_ID:secrets.CLOUDFLARE_ACCOUNT_ID||variables.CLOUDFLARE_ACCOUNT_ID,
            MONGODB_URI:secrets.MONGODB_URI,
            AUTH_SECRET:secrets.AUTH_SECRET,
            LEON_PRIVATE_CODE:secrets.LEON_PRIVATE_CODE,
            LIVE_API_ORIGIN:variables.LIVE_API_ORIGIN
          };
          const requiredReady=secrets.CLOUDFLARE_API_TOKEN&&secrets.MONGODB_URI;
          let livePass=false;
          try {
            const live=JSON.parse(fs.readFileSync('audit/LIVE-BACKEND.json','utf8'));
            livePass=live?.ok===true&&live?.status==='PASS_LIVE_BACKEND_E2E';
          } catch {}
          fs.writeFileSync('audit/BACKEND-SECRET-PRESENCE.json',JSON.stringify({generatedAt:new Date().toISOString(),status:'BACKEND_CREDENTIAL_PRESENCE_ONLY',ok:true,secrets,variables,usable,requiredReady,livePass,note:'Somente booleanos de presença; nenhum valor secreto ou variável foi gravado. CLOUDFLARE_API_TOKEN e MONGODB_URI só contam como prontos quando existem em GitHub Actions secrets.'},null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`ready=${requiredReady?'true':'false'}\nlive_pass=${livePass?'true':'false'}\n`);
          NODE

      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/BACKEND-SECRET-PRESENCE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: record backend credential presence matrix'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch live backend once required secrets exist
        if: steps.presence.outputs.ready == 'true' && steps.presence.outputs.live_pass != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run live-backend-e2e.yml --repo kaalflash12/naruto-shinobi-no-sho --ref main
          echo 'DISPATCHED_LIVE_BACKEND_AFTER_REQUIRED_CREDENTIALS'
