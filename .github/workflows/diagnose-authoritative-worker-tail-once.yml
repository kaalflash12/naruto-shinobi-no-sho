name: Diagnose Authoritative Worker Tail Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-authoritative-worker-tail-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_ORIGIN: https://naruto-shinobi-no-sho-api.mestrederpg35.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Worker dependencies
        working-directory: cloudflare/r41-api
        run: npm install --no-audit --no-fund
      - name: Tail only authoritative register exception
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          tail_file="$RUNNER_TEMP/authoritative-tail.log"
          response_file="$RUNNER_TEMP/register-response.txt"
          : > "$tail_file"

          timeout 35s npx wrangler tail naruto-shinobi-no-sho-api \
            --format pretty \
            --method POST \
            --search R41_AUTHORITATIVE_ENTRY_ERROR >"$tail_file" 2>&1 &
          tail_pid=$!
          sleep 6

          suffix="${GITHUB_RUN_ID}-${RANDOM}"
          username="diag_${suffix}"
          email="diag_${suffix}@example.invalid"
          payload="$(node -e 'process.stdout.write(JSON.stringify({username:process.argv[1],password:"DiagOnly_7f3c9b1a!",displayName:"Diagnostic",email:process.argv[2]}))' "$username" "$email")"
          http_code="$(curl -sS --max-time 20 -o "$response_file" -w '%{http_code}' -X POST "$API_ORIGIN/api/auth/register" -H 'content-type: application/json' --data "$payload" || true)"
          echo "REGISTER_HTTP=$http_code"

          # If the diagnostic request unexpectedly succeeds, delete only that generated account.
          if [ "$http_code" = "201" ]; then
            token="$(RESP_FILE="$response_file" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let d={};try{d=JSON.parse(fs.readFileSync(process.env.RESP_FILE,'utf8'))}catch{}
          process.stdout.write(String(d.token||''));
          NODE
            )"
            if [ -n "$token" ]; then
              curl -sS --max-time 15 -X DELETE "$API_ORIGIN/api/auth/account" -H "authorization: Bearer $token" >/dev/null 2>&1 || true
            fi
          fi

          sleep 8
          kill "$tail_pid" >/dev/null 2>&1 || true
          wait "$tail_pid" >/dev/null 2>&1 || true

          TAIL_FILE="$tail_file" HTTP_CODE="$http_code" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let raw=fs.readFileSync(process.env.TAIL_FILE,'utf8');
          raw=raw
            .replace(/mongodb(?:\+srv)?:\/\/[^\s"']+/gi,'<redacted-mongodb-uri>')
            .replace(/Bearer\s+[A-Za-z0-9._~+\/-]+/gi,'Bearer <redacted>')
            .replace(/DiagOnly_[^\s"']+/g,'<redacted-password>')
            .replace(/diag_[A-Za-z0-9_-]+@example\.invalid/g,'<redacted-email>')
            .replace(/diag_[A-Za-z0-9_-]+/g,'<redacted-username>');
          const lines=raw.split(/\r?\n/).filter(Boolean);
          const relevant=[];
          for(let i=0;i<lines.length;i++){
            if(/R41_AUTHORITATIVE_ENTRY_ERROR|Mongo(Server|Runtime|Network|Compatibility|Parse|InvalidArgument|API)?Error|TypeError|Error:|code(Name)?:|ERR_/i.test(lines[i])){
              for(let j=Math.max(0,i-1);j<=Math.min(lines.length-1,i+5);j++) relevant.push(lines[j]);
            }
          }
          const unique=[...new Set(relevant)].slice(0,80);
          console.log(JSON.stringify({status:'AUTHORITATIVE_TAIL_DIAGNOSTIC',registerHttp:Number(process.env.HTTP_CODE||0),captured:unique},null,2));
          if(!raw.includes('R41_AUTHORITATIVE_ENTRY_ERROR')) throw new Error('AUTHORITATIVE_ERROR_MARKER_NOT_CAPTURED');
          NODE
