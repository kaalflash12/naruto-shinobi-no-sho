name: Diagnose Local Workerd Register Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-local-workerd-register-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            cloudflare/r41-api
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install and apply proven runtime fixes locally
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          python - <<'PY'
          from pathlib import Path
          p=Path('src/entry-authoritative.js');s=p.read_text(encoding='utf-8')
          old='try{await profiles.dropIndex("uq_mechanical_profile_user");}catch(e){if(Number(e?.code)!==27&&String(e?.codeName||"")!=="IndexNotFound")throw e;}'
          new='try{await profiles.dropIndex("uq_mechanical_profile_user");}catch(e){const code=Number(e?.code),codeName=String(e?.codeName||"");if(code!==26&&code!==27&&codeName!=="NamespaceNotFound"&&codeName!=="IndexNotFound")throw e;}'
          if old not in s: raise SystemExit('authority block missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          p=Path('src/index.js');s=p.read_text(encoding='utf-8')
          for old,new in {
            'iterations=210000':'iterations=100000',
            'passIter:210000':'passIter:100000',
            'hashPassword(recoveryCode,recoverySalt,120000)':'hashPassword(recoveryCode,recoverySalt,100000)',
            'iterations:120000':'iterations:100000',
            'u.passIter||210000':'u.passIter||100000',
            'rc.iterations||120000':'rc.iterations||100000',
          }.items():
            if old not in s: raise SystemExit(f'missing index literal {old}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8',newline='\n')
          p=Path('src/entry.js');s=p.read_text(encoding='utf-8')
          if 'iterations=120000' not in s: raise SystemExit('entry iteration literal missing')
          p.write_text(s.replace('iterations=120000','iterations=100000'),encoding='utf-8',newline='\n')
          PY
          npm run check
      - name: Start local Cloudflare workerd against Atlas
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MONGODB_URI:-}"
          cat > wrangler-diagnostic.toml <<'EOF'
          name = "shinobi-local-auth-diagnostic"
          main = "src/entry-authoritative.js"
          compatibility_date = "2026-08-19"
          compatibility_flags = ["nodejs_compat", "no_throw_on_not_implemented_tls_options"]
          [vars]
          MONGODB_DB = "naruto_shinobi_no_sho"
          AUTH_SECRET = "LOCAL_DIAGNOSTIC_AUTH_SECRET_NOT_PRODUCTION"
          ALLOWED_ORIGINS = "http://127.0.0.1:8787"
          EOF
          printf 'MONGODB_URI="%s"\n' "$MONGODB_URI" > .dev.vars
          chmod 600 .dev.vars
          npx wrangler dev --local --config wrangler-diagnostic.toml --port 8787 --ip 127.0.0.1 >"$RUNNER_TEMP/workerd-register.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/workerd.pid"
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8787/api/status >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/workerd-register.log"
          exit 1
      - name: Reproduce register and capture exact local workerd result
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${RANDOM}"; username="workerd_${suffix}"; username="${username:0:32}"; email="${username}@example.test"; password="Diag!${GITHUB_RUN_ID}aA9"
          echo "$username" > "$RUNNER_TEMP/diagnostic-username.txt"
          payload="$(USER="$username" EMAIL="$email" PASS="$password" node --input-type=module <<'NODE'
          process.stdout.write(JSON.stringify({username:process.env.USER,password:process.env.PASS,displayName:'Local Workerd Diagnostic',email:process.env.EMAIL}));
          NODE
          )"
          response_file="$RUNNER_TEMP/workerd-response.txt"
          code="$(curl -sS --max-time 30 -o "$response_file" -w '%{http_code}' -X POST http://127.0.0.1:8787/api/auth/register -H 'content-type: application/json' --data "$payload" || true)"
          sleep 2
          HTTP_CODE="$code" RESPONSE_FILE="$response_file" LOG_FILE="$RUNNER_TEMP/workerd-register.log" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const redact=s=>String(s||'').replace(/mongodb(?:\+srv)?:\/\/[^\s"']+/gi,'<redacted-mongodb-uri>').replace(/workerd_[A-Za-z0-9_-]+/g,'<redacted-username>').replace(/Diag![A-Za-z0-9!_-]+/g,'<redacted-password>');
          const response=redact(fs.readFileSync(process.env.RESPONSE_FILE,'utf8')).slice(0,2000);
          const log=redact(fs.readFileSync(process.env.LOG_FILE,'utf8')).split(/\r?\n/).filter(Boolean).slice(-160);
          console.log(JSON.stringify({status:'LOCAL_WORKERD_REGISTER_DIAGNOSTIC',http:Number(process.env.HTTP_CODE||0),response,tail:log},null,2));
          NODE
      - name: Clean diagnostic account and stop workerd
        if: always()
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/workerd.pid" ]; then kill "$(cat "$RUNNER_TEMP/workerd.pid")" >/dev/null 2>&1 || true; fi
          rm -f .dev.vars wrangler-diagnostic.toml
          if [ -n "${MONGODB_URI:-}" ] && [ -f "$RUNNER_TEMP/diagnostic-username.txt" ]; then
            user="$(cat "$RUNNER_TEMP/diagnostic-username.txt")"
            DIAG_USER="$user" node --input-type=module <<'NODE'
          import { MongoClient } from 'mongodb';
          const client=new MongoClient(process.env.MONGODB_URI,{serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});
          await client.connect();
          try{
            const db=client.db('naruto_shinobi_no_sho');
            const u=await db.collection('users').findOne({username:process.env.DIAG_USER},{projection:{_id:1}});
            if(u?._id){
              await Promise.all([
                db.collection('sessions').deleteMany({userId:u._id}),
                db.collection('recovery_codes').deleteMany({userId:u._id}),
                db.collection('mechanical_profiles').deleteMany({userId:u._id}),
                db.collection('users').deleteOne({_id:u._id})
              ]);
              console.log('PASS_LOCAL_DIAGNOSTIC_ACCOUNT_CLEANUP');
            }
          }finally{await client.close();}
          NODE
          fi
