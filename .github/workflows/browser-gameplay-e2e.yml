name: Browser Gameplay E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'r41-api-config.js'
      - 'r41-github-api.js'
      - 'r41-account-ui.js'
      - 'r41-map-hitfix.css'
      - 'src/**'
      - 'assets/**'
      - 'tools/browser-gameplay-e2e*.mjs'
      - '.github/workflows/browser-gameplay-e2e.yml'

permissions:
  contents: write

concurrency:
  group: browser-gameplay-e2e-main
  cancel-in-progress: false

jobs:
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for coherent GitHub Pages plus Cloudflare backend
        shell: bash
        run: |
          set -euo pipefail
          base='https://kaalflash12.github.io/naruto-shinobi-no-sho'
          for i in $(seq 1 120); do
            q="$RANDOM-$i-$(date +%s)"
            html="$(curl -fsSL --max-time 20 "$base/?deploy-check=$q" 2>/dev/null || true)"
            cfg="$(curl -fsSL --max-time 20 "$base/r41-api-config.js?deploy-check=$q" 2>/dev/null || true)"
            api="$(curl -fsSL --max-time 20 "$base/r41-github-api.js?deploy-check=$q" 2>/dev/null || true)"
            account="$(curl -fsSL --max-time 20 "$base/r41-account-ui.js?deploy-check=$q" 2>/dev/null || true)"
            app="$(curl -fsSL --max-time 20 "$base/app.js?deploy-check=$q" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "$base/r41-map-hitfix.css?deploy-check=$q" 2>/dev/null || true)"
            origin="$(printf '%s' "$cfg" | sed -n 's/.*const baked="\([^"]*\)".*/\1/p' | head -1)"
            backend_ok=0
            if [[ "$origin" =~ ^https:// ]] && [[ ! "$origin" =~ (supabase|vercel|turso) ]]; then
              status="$(curl -fsSL --max-time 20 -H 'Origin: https://kaalflash12.github.io' "$origin/api/status" 2>/dev/null || true)"
              if STATUS_JSON="$status" node --input-type=module <<'NODE'
          const d=JSON.parse(process.env.STATUS_JSON||'{}');if(!(d.ok===true&&d.configured===true&&d.storage==='mongodb-atlas'&&d.realtime==='cloudflare-durable-objects'&&d.buildAuthority==='R41-AUTHORITATIVE-TERION-20260823-V6'))process.exit(1);
          NODE
              then backend_ok=1;fi
            fi
            if [ "$backend_ok" -eq 1 ] \
              && printf '%s' "$html" | grep -q 'NARUTO SHINOBI NO SHO' \
              && printf '%s' "$html" | grep -q 'r41-map-hitfix.css' \
              && printf '%s' "$cfg" | grep -q 'NARUTO-SHINOBI-NO-SHO-CLOUDFLARE-MONGODB' \
              && printf '%s' "$api" | grep -q 'cloudflare-mongodb-durable-objects' \
              && printf '%s' "$account" | grep -q 'ACCOUNT-UI-20260823-V3' \
              && printf '%s' "$app" | grep -q 'R41-MD-OPERACIONAL-APLICADO' \
              && printf '%s' "$css" | grep -q '.play-map .map-pin'; then
              echo "API_ORIGIN=$origin" >> "$GITHUB_ENV"
              echo "COMPLETE_PUBLIC_CLOUDFLARE_BUILD_READY attempt=$i"
              exit 0
            fi
            sleep 5
          done
          echo 'Public site did not reach coherent Cloudflare/MongoDB gameplay build.' >&2
          exit 1

      - name: Run real Chromium gameplay E2E V4
        id: gameplay
        continue-on-error: true
        env:
          PUBLIC_GAME_URL: https://kaalflash12.github.io/naruto-shinobi-no-sho/
          BROWSER_GAMEPLAY_REPORT: audit/BROWSER-GAMEPLAY-E2E.json
        run: node tools/browser-gameplay-e2e-v4.mjs

      - name: Commit gameplay evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f audit/BROWSER-GAMEPLAY-E2E.json
          status="$(node -e "const r=require('./audit/BROWSER-GAMEPLAY-E2E.json');process.stdout.write(r.status||'UNKNOWN')")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/BROWSER-GAMEPLAY-E2E.json
          if ! git diff --cached --quiet; then
            git commit -m "test: gameplay evidence ${status}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gameplay-e2e
          path: audit/BROWSER-GAMEPLAY-E2E.json
          if-no-files-found: warn

      - name: Enforce gameplay gate
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='audit/BROWSER-GAMEPLAY-E2E.json';if(!fs.existsSync(p))throw new Error('BROWSER_GAMEPLAY_REPORT_MISSING');const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.ok!==true||r.status!=='PASS_BROWSER_GAMEPLAY_E2E')throw new Error(`GAMEPLAY_E2E_FAILED ${r.status}: ${(r.failures||[]).join(' | ')}`);
          if(!Array.isArray(r.contracts)||r.contracts.length<11||r.contracts.some(x=>x.status!=='PASS_GAMEPLAY_E2E'))throw new Error('11 gameplay contracts not proven');
          console.log(r.status,'contracts=',r.contracts.length);
          NODE
