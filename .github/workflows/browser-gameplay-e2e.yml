name: Browser Gameplay E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'r41-api-config.js'
      - 'r41-github-api.js'
      - 'r41-account-ui.js'
      - 'src/**'
      - 'assets/**'
      - 'tools/browser-gameplay-e2e*.mjs'
      - '.github/workflows/browser-gameplay-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'r41-api-config.js'
      - 'r41-github-api.js'
      - 'r41-account-ui.js'
      - 'src/**'
      - 'assets/**'
      - 'tools/browser-gameplay-e2e*.mjs'
      - '.github/workflows/browser-gameplay-e2e.yml'

permissions:
  contents: write

concurrency:
  group: browser-gameplay-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gameplay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight canonical Supabase backend
        shell: bash
        run: |
          set -euo pipefail
          cfg="$(curl -fsSL --max-time 30 'https://kaalflash12.github.io/naruto-shinobi-no-sho/r41-api-config.js?preflight='"$RANDOM")"
          printf '%s' "$cfg" | grep -q 'NARUTO-SHINOBI-NO-SHO-SUPABASE-POSTGRES'
          printf '%s' "$cfg" | grep -q 'rlyiwlwzrdgvcwawrnpl.supabase.co/functions/v1/shinobi-api'
          origin="$(printf '%s' "$cfg" | sed -n 's/.*const SUPABASE_ORIGIN="\([^"]*\)".*/\1/p' | head -1)"
          key="$(printf '%s' "$cfg" | sed -n 's/.*const SUPABASE_KEY="\([^"]*\)".*/\1/p' | head -1)"
          test -n "$origin" && test -n "$key"
          status="$(curl -fsSL --max-time 30 -H "apikey: $key" -H 'Origin: https://kaalflash12.github.io' "$origin/api/status")"
          STATUS_JSON="$status" node --input-type=module <<'NODE'
          const d=JSON.parse(process.env.STATUS_JSON||'{}');
          if(d.ok!==true||d.storage!=='supabase-postgres'||!String(d.backend||'').startsWith('shinobi-api-')) throw new Error(JSON.stringify(d));
          console.log('SUPABASE_BACKEND_READY',d.build,d.backend,d.storage);
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for public site update
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            cfg="$(curl -fsSL 'https://kaalflash12.github.io/naruto-shinobi-no-sho/r41-api-config.js?deploy-check='"$RANDOM" || true)"
            html="$(curl -fsSL 'https://kaalflash12.github.io/naruto-shinobi-no-sho/?deploy-check='"$RANDOM" || true)"
            if printf '%s' "$cfg" | grep -q 'NARUTO-SHINOBI-NO-SHO-SUPABASE-POSTGRES' && printf '%s' "$html" | grep -q 'NARUTO SHINOBI NO SHO'; then
              echo 'Public GitHub Pages + Supabase build is responding.'
              exit 0
            fi
            sleep 5
          done
          echo 'Public site did not publish the Supabase build in time.' >&2
          exit 1

      - name: Run real Chromium gameplay E2E V4
        id: gameplay
        continue-on-error: true
        env:
          PUBLIC_GAME_URL: https://kaalflash12.github.io/naruto-shinobi-no-sho/
          BROWSER_GAMEPLAY_REPORT: audit/BROWSER-GAMEPLAY-E2E.json
        run: node tools/browser-gameplay-e2e-v4.mjs

      - name: Commit gameplay evidence
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test -f audit/BROWSER-GAMEPLAY-E2E.json
          status="$(node -e "const r=require('./audit/BROWSER-GAMEPLAY-E2E.json');process.stdout.write(r.status||'UNKNOWN')")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/BROWSER-GAMEPLAY-E2E.json
          if ! git diff --cached --quiet; then
            git commit -m "test: gameplay evidence ${status}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gameplay-e2e
          path: audit/BROWSER-GAMEPLAY-E2E.json
          if-no-files-found: warn

      - name: Enforce gameplay gate
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='audit/BROWSER-GAMEPLAY-E2E.json';
          if(!fs.existsSync(p))throw new Error('BROWSER_GAMEPLAY_REPORT_MISSING');
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.ok!==true||r.status!=='PASS_BROWSER_GAMEPLAY_E2E')throw new Error(`GAMEPLAY_E2E_FAILED ${r.status}: ${(r.failures||[]).join(' | ')}`);
          if(!Array.isArray(r.contracts)||r.contracts.length<11||r.contracts.some(x=>x.status!=='PASS_GAMEPLAY_E2E'))throw new Error('11 gameplay contracts not proven');
          console.log(r.status,'contracts=',r.contracts.length);
          NODE
