name: One-shot TERION authority patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-terion-authority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply server-authority integration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const indexPath='cloudflare/r41-api/src/index.js';
          let index=fs.readFileSync(indexPath,'utf8');
          const importLine='import { resolveTerionIntent, hasClientResult } from "./terion-mechanics.js";';
          if(!index.includes(importLine)){
            index=index.replace('import { MongoClient, ObjectId } from "mongodb";','import { MongoClient, ObjectId } from "mongodb";\n'+importLine);
          }
          const oldAction=/    if\(action==="action"\)\{[^\n]*\}\n/;
          if(!oldAction.test(index))throw new Error('GameRoom action handler não encontrado');
          const newAction=`    if(action==="action"){
              const envelope=b.action??b;
              const type=cleanText(envelope?.type||envelope?.action||"action",80);
              const forbidden=/grant|award|give.?xp|set.?level|admin/i.test(type);
              if(forbidden)return new Response(JSON.stringify({ok:false,error:"CLIENT_AUTHORITY_FORBIDDEN"}),{status:400,headers:JSON_HEADERS});
              if(hasClientResult(envelope))return new Response(JSON.stringify({ok:false,error:"CLIENT_MECHANICAL_RESULT_FORBIDDEN"}),{status:400,headers:JSON_HEADERS});
              const member=room.members?.[b.userId]||{};
              const mechanicalResult=resolveTerionIntent({intent:envelope,character:member.character||{}});
              const ev={id:crypto.randomUUID(),userId:b.userId,playerId:b.playerId||"",type,payload:envelope,mechanicalResult,createdAt:nowIso()};
              room.actions.push(ev);room.actions=room.actions.slice(-200);await this.write(room);
              return Response.json({ok:true,accepted:true,event:ev,mechanicalResult,serverTime:nowIso()});
            }
`;
          index=index.replace(oldAction,newAction);
          fs.writeFileSync(indexPath,index);

          const e2ePath='tools/live-worker-e2e.mjs';
          let e2e=fs.readFileSync(e2ePath,'utf8');
          const accepted="  assert(intent.data?.accepted === true, 'ação de intenção válida foi recusada');\n  record('intentActionAccepted');";
          const acceptedNew=`  assert(intent.data?.accepted === true, 'ação de intenção válida foi recusada');
            assert(intent.data?.mechanicalResult?.authority === 'server', 'TERION não retornou autoridade server');
            assert(intent.data?.mechanicalResult?.system === 'TERION_2D10', 'sistema mecânico inesperado');
            assert(Number.isInteger(intent.data?.mechanicalResult?.dice?.hope) && intent.data.mechanicalResult.dice.hope >= 1 && intent.data.mechanicalResult.dice.hope <= 10, 'd10 Esperança inválido');
            assert(Number.isInteger(intent.data?.mechanicalResult?.dice?.doom) && intent.data.mechanicalResult.dice.doom >= 1 && intent.data.mechanicalResult.dice.doom <= 10, 'd10 Perdição inválido');
            assert(Number.isFinite(intent.data?.mechanicalResult?.total), 'total TERION inválido');
            record('intentActionAccepted');
            record('serverTerionMechanicalResult');`;
          if(!e2e.includes(accepted))throw new Error('bloco intentActionAccepted não encontrado');
          e2e=e2e.replace(accepted,acceptedNew);
          const sync="  assert(actions.some(x => x.type === 'move'), 'ação aceita não apareceu no estado da sala');\n  record('roomStateSynchronized');";
          const syncNew=`  assert(actions.some(x => x.type === 'move'), 'ação aceita não apareceu no estado da sala');
            const synchronizedAction = actions.find(x => x.id === intent.data?.event?.id);
            assert(synchronizedAction?.mechanicalResult?.authority === 'server', 'resultado TERION não foi persistido no Durable Object');
            assert(synchronizedAction.mechanicalResult.total === intent.data.mechanicalResult.total, 'resultado TERION persistido divergiu da resposta');
            record('roomStateSynchronized');
            record('serverTerionResultSynchronized');`;
          if(!e2e.includes(sync))throw new Error('bloco roomStateSynchronized não encontrado');
          e2e=e2e.replace(sync,syncNew);
          fs.writeFileSync(e2ePath,e2e);

          const workflowPath='.github/workflows/live-backend-e2e.yml';
          let workflow=fs.readFileSync(workflowPath,'utf8');
          const oldRequired="'intentActionAccepted','clientMechanicalResultRejected','roomStateSynchronized'";
          const newRequired="'intentActionAccepted','serverTerionMechanicalResult','clientMechanicalResultRejected','roomStateSynchronized','serverTerionResultSynchronized'";
          if(!workflow.includes(oldRequired))throw new Error('lista de gates live não encontrada');
          workflow=workflow.replace(oldRequired,newRequired);
          fs.writeFileSync(workflowPath,workflow);
          NODE
      - name: Run TERION unit and syntax gates
        working-directory: cloudflare/r41-api
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run check
      - name: Commit integrated patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-terion-authority.yml
          git add cloudflare/r41-api/src/index.js cloudflare/r41-api/src/terion-mechanics.js cloudflare/r41-api/test/terion-mechanics.test.mjs cloudflare/r41-api/package.json tools/live-worker-e2e.mjs .github/workflows/live-backend-e2e.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(terion): enforce server-authoritative online mechanics'
          git pull --rebase origin main
          git push origin HEAD:main
