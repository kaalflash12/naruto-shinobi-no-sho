name: Supabase Live Online E2E

on:
  push:
    branches: [main]
    paths:
      - 'r41-api-config.js'
      - 'tools/supabase-live-e2e.mjs'
      - '.github/workflows/supabase-live-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'r41-api-config.js'
      - 'tools/supabase-live-e2e.mjs'
      - '.github/workflows/supabase-live-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      API_ORIGIN: https://rlyiwlwzrdgvcwawrnpl.supabase.co/functions/v1/shinobi-api
      REPORT_PATH: audit/SUPABASE-LIVE-E2E.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check E2E syntax
        run: node --check tools/supabase-live-e2e.mjs

      - name: Run live auth save rooms TERION boundary E2E
        run: node tools/supabase-live-e2e.mjs

      - name: Enforce PASS
        run: |
          node - <<'NODE'
          const r=require('./audit/SUPABASE-LIVE-E2E.json');
          if(!r.ok || r.status!=='PASS_SUPABASE_LIVE_E2E') throw new Error('Supabase live E2E sem PASS');
          const required=[
            'statusConfigured','registerTwoAccounts','authenticatedSessions','unauthorizedRejected',
            'saveLoadRoundTrip','kuraiPersisted','slotListing','roomCreate','roomJoinSecondAccount',
            'roomHeartbeat','roomMessaging','intentActionAccepted','clientMechanicalResultRejected',
            'roomStateSynchronized','worldTickPersisted','savePointPersisted','factsOnlyNarrator',
            'saveCleanup','sessionRevocation'
          ];
          for(const k of required) if(!r.checks?.[k]) throw new Error(`Gate ausente: ${k}`);
          console.log(r.status);
          NODE

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-supabase-live-e2e
          path: audit/SUPABASE-LIVE-E2E.json
          if-no-files-found: warn
