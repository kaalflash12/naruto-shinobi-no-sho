          s=s.replace('let client=null,clientUri="",authorityIndexesPromise=null;','let authorityIndexesReady=false;',1)
          old='    try{await profiles.dropIndex("uq_mechanical_profile_user");}catch(e){if(Number(e?.code)!==27&&String(e?.codeName||"")!=="IndexNotFound")throw e;}'
          new='    try{await profiles.dropIndex("uq_mechanical_profile_user");}catch(e){const code=Number(e?.code),codeName=String(e?.codeName||"");if(code!==26&&code!==27&&codeName!=="NamespaceNotFound"&&codeName!=="IndexNotFound")throw e;}'
          if old not in s: raise SystemExit('AUTHORITY_NAMESPACE_BLOCK_NOT_FOUND')
          s=s.replace(old,new,1)
          old='async function ensureAuthorityIndexes(store){\n  if(!authorityIndexesPromise)authorityIndexesPromise=(async()=>{'
          new='async function ensureAuthorityIndexes(store){\n  if(authorityIndexesReady)return;\n  await (async()=>{'
          if old not in s: raise SystemExit('AUTHORITY_INDEX_START_NOT_FOUND')
          s=s.replace(old,new,1)
          old='  })().catch(e=>{authorityIndexesPromise=null;throw e;});\n  await authorityIndexesPromise;\n}'
          new='  })();\n  authorityIndexesReady=true;\n}'
          if old not in s: raise SystemExit('AUTHORITY_INDEX_END_NOT_FOUND')
          s=s.replace(old,new,1)
          old='async function db(env){\n  if(!env.MONGODB_URI)throw new Error("MONGODB_URI_MISSING");\n  if(!client||clientUri!==env.MONGODB_URI){clientUri=env.MONGODB_URI;client=new MongoClient(env.MONGODB_URI,{maxPoolSize:4,minPoolSize:0,maxIdleTimeMS:45000,serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});await client.connect();authorityIndexesPromise=null;}\n  const store=client.db(env.MONGODB_DB||"naruto_shinobi_no_sho");await ensureAuthorityIndexes(store);return store;\n}'
          new='async function db(env){\n  if(!env.MONGODB_URI)throw new Error("MONGODB_URI_MISSING");\n  const store=await requestMongoDb(env,"naruto_shinobi_no_sho");\n  await ensureAuthorityIndexes(store);\n  return store;\n}'
