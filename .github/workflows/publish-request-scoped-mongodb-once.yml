name: Publish Request Scoped MongoDB Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-request-scoped-mongodb-once.yml

permissions:
  contents: write

jobs:
  prove-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            cloudflare/r41-api
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies and clean known diagnostics
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --input-type=module <<'NODE'
          import { MongoClient } from 'mongodb';
          const c=new MongoClient(process.env.MONGODB_URI,{serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});await c.connect();
          try{
            const db=c.db('naruto_shinobi_no_sho');
            const rx=/^(?:publish_|authfix_|authdiag_|e2e_fix_|logindiag_|scopeprobe_|lifecycle_)/;
            const rows=await db.collection('users').find({username:{$regex:rx}},{projection:{_id:1}}).toArray();
            if(rows.length>30)throw new Error(`DIAGNOSTIC_CLEANUP_REFUSED_${rows.length}`);
            const ids=rows.map(x=>x._id);
            if(ids.length)await Promise.all([
              db.collection('sessions').deleteMany({userId:{$in:ids}}),db.collection('recovery_codes').deleteMany({userId:{$in:ids}}),
              db.collection('mechanical_profiles').deleteMany({userId:{$in:ids}}),db.collection('saves').deleteMany({userId:{$in:ids}}),
              db.collection('audit_events').deleteMany({userId:{$in:ids}}),db.collection('users').deleteMany({_id:{$in:ids}})
            ]);
            console.log(JSON.stringify({status:'PASS_REQUEST_SCOPE_PRE_CLEANUP',deleted:ids.length}));
          }finally{await c.close();}
          NODE

      - name: Apply proven auth fixes and request-scoped MongoDB lifecycle
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, json

          Path('src/mongo-request.js').write_text(r'''import { MongoClient } from "mongodb";

export const R41_MONGO_REQUEST_SCOPE = Symbol.for("r41.mongo.request.scope.v1");

export function createMongoRequestEnv(env){
  const scope={client:null,clientPromise:null};
  return new Proxy(env,{get(target,prop){if(prop===R41_MONGO_REQUEST_SCOPE)return scope;return target[prop];}});
}

function requestScope(env){
  const scope=env?.[R41_MONGO_REQUEST_SCOPE];
  if(!scope)throw new Error("MONGO_REQUEST_SCOPE_MISSING");
  return scope;
}

export async function requestMongoDb(env,fallbackDb="naruto_shinobi_no_sho"){
  const scope=requestScope(env);
  if(!scope.clientPromise){
    scope.clientPromise=(async()=>{
      const client=new MongoClient(env.MONGODB_URI,{maxPoolSize:1,minPoolSize:0,maxIdleTimeMS:0,serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});
      await client.connect();
      scope.client=client;
      return client;
    })().catch(e=>{scope.client=null;scope.clientPromise=null;throw e;});
  }
  const client=await scope.clientPromise;
  return client.db(env.MONGODB_DB||fallbackDb);
}

export async function closeMongoRequestEnv(env){
  const scope=env?.[R41_MONGO_REQUEST_SCOPE];
  if(!scope)return;
  let client=scope.client;
  if(!client&&scope.clientPromise){try{client=await scope.clientPromise;}catch{}}
  scope.client=null;
  scope.clientPromise=null;
  if(client){try{await client.close();}catch{}}
}
