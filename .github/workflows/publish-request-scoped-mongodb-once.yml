    const path=new URL(req.url).pathname.replace(/\\/+$/g,"")||"/";
    if(path==="/"||path==="/api/status")return status(req,requestEnv,ctx);
    if(path==="/api/auth/me")return augmentAccountEmail(req,requestEnv,await base.fetch(req,requestEnv,ctx));
