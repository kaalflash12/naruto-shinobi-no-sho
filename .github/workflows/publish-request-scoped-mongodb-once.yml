name: Publish Request Scoped MongoDB Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-request-scoped-mongodb-once.yml
      - cloudflare/r41-api/test/apply-request-scoped-runtime-fix.mjs
      - cloudflare/r41-api/test/apply-direct-account-helper-fix.mjs
      - cloudflare/r41-api/test/request-scoped-auth-lifecycle.mjs

permissions:
  contents: write

jobs:
  prove-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: naruto_shinobi_no_sho
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: cloudflare/r41-api

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: cloudflare/r41-api
        run: npm install --no-audit --no-fund

      - name: Clean diagnostic accounts before proof
        working-directory: cloudflare/r41-api
        run: node test/cleanup-runtime-diagnostic-users.mjs

      - name: Apply request-scoped runtime fix
        working-directory: cloudflare/r41-api
        run: node test/apply-request-scoped-runtime-fix.mjs

      - name: Replace auth me loopback with direct helper
        working-directory: cloudflare/r41-api
        run: node test/apply-direct-account-helper-fix.mjs

      - name: Prevent closed client reuse inside one request
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const helper=`import { MongoClient } from "mongodb";

          export const R41_MONGO_REQUEST_SCOPE = Symbol.for("r41.mongo.request.scope.v2");

          export function createMongoRequestEnv(env){
            const scope={clients:[]};
            return new Proxy(env,{get(target,prop){if(prop===R41_MONGO_REQUEST_SCOPE)return scope;return target[prop];}});
          }

          function requestScope(env){
            const scope=env?.[R41_MONGO_REQUEST_SCOPE];
            if(!scope)throw new Error("MONGO_REQUEST_SCOPE_MISSING");
            return scope;
          }

          export async function requestMongoDb(env,fallbackDb="naruto_shinobi_no_sho"){
            const scope=requestScope(env);
            const client=new MongoClient(env.MONGODB_URI,{maxPoolSize:1,minPoolSize:0,maxIdleTimeMS:0,serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});
            try{
              await client.connect();
              scope.clients.push(client);
              return client.db(env.MONGODB_DB||fallbackDb);
            }catch(e){
              try{await client.close();}catch{}
              throw e;
            }
          }

          export async function closeMongoRequestEnv(env){
            const scope=env?.[R41_MONGO_REQUEST_SCOPE];
            if(!scope)return;
            const clients=Array.isArray(scope.clients)?scope.clients.splice(0):[];
            await Promise.allSettled(clients.map(client=>client.close()));
          }
          `.replace(/^          /gm,'');
          fs.writeFileSync('src/mongo-request.js',helper,'utf8');

          const p='test/cloudflare-runtime-contract.test.mjs';
          let contract=fs.readFileSync(p,'utf8');
          const anchor='assert.match(mongoRequest,/client\\.close\\(\\)/);';
          if(!contract.includes(anchor))throw new Error('MONGO_CONTRACT_ANCHOR_NOT_FOUND');
          contract=contract.replace(anchor,`${anchor}\nassert.match(mongoRequest,/const scope=\\{clients:\\[\\]\\}/);\nassert.doesNotMatch(mongoRequest,/clientPromise|scope\\.client\\b/);\nassert.match(mongoRequest,/scope\\.clients\\.push\\(client\\)/);\nassert.match(mongoRequest,/Promise\\.allSettled\\(clients\\.map\\(client=>client\\.close\\(\\)\\)\\)/);`);
          fs.writeFileSync(p,contract,'utf8');
          console.log('PASS_REQUEST_SCOPED_MULTI_CLIENT_LIFECYCLE_PATCH');
          NODE

      - name: Static regressions and Wrangler dry run
        working-directory: cloudflare/r41-api
        run: |
          npm test
          npm run check
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/request-scope-dry"

      - name: Start official workerd against Atlas
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'name = "shinobi-request-lifecycle-proof"' \
            'main = "src/entry-authoritative.js"' \
            'compatibility_date = "2026-08-19"' \
            'compatibility_flags = ["nodejs_compat", "no_throw_on_not_implemented_tls_options"]' \
            '[vars]' \
            'MONGODB_DB = "naruto_shinobi_no_sho"' \
            'AUTH_SECRET = "LOCAL_REQUEST_LIFECYCLE_PROOF_SECRET"' \
            'ALLOWED_ORIGINS = "http://127.0.0.1:8787"' > wrangler-lifecycle.toml
          printf 'MONGODB_URI="%s"\n' "$MONGODB_URI" > .dev.vars
          chmod 600 .dev.vars
          npx wrangler dev --local --config wrangler-lifecycle.toml --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/request-lifecycle.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/request-lifecycle.pid"
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8787/api/status >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/request-lifecycle.log"
          exit 1

      - name: Prove complete multi-request auth lifecycle
        working-directory: cloudflare/r41-api
        env:
          API_ORIGIN: http://127.0.0.1:8787
        run: node test/request-scoped-auth-lifecycle.mjs

      - name: Stop workerd, expose diagnostics and clean accounts
        if: always()
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/request-lifecycle.log" ]; then
            echo '=== WORKERD REQUEST LIFECYCLE LOG ==='
            cat "$RUNNER_TEMP/request-lifecycle.log"
          fi
          if [ -f "$RUNNER_TEMP/request-lifecycle.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/request-lifecycle.pid")" >/dev/null 2>&1 || true
          fi
          rm -f .dev.vars wrangler-lifecycle.toml
          node test/cleanup-runtime-diagnostic-users.mjs

      - name: Publish only after full proof
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            cloudflare/r41-api/src/mongo-request.js \
            cloudflare/r41-api/src/index.js \
            cloudflare/r41-api/src/entry.js \
            cloudflare/r41-api/src/entry-authoritative.js \
            cloudflare/r41-api/test/cloudflare-runtime-contract.test.mjs \
            cloudflare/r41-api/package.json
          git diff --cached --check
          git commit -m 'fix: scope MongoDB connections to each Worker request'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
