      - name: Static regression and Wrangler dry run
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/request-scope-dry"

      - name: Start official workerd against real Atlas
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler-lifecycle.toml <<'EOF'
          name = "shinobi-request-lifecycle-proof"
          main = "src/entry-authoritative.js"
          compatibility_date = "2026-08-19"
          compatibility_flags = ["nodejs_compat", "no_throw_on_not_implemented_tls_options"]
          [vars]
          MONGODB_DB = "naruto_shinobi_no_sho"
          AUTH_SECRET = "LOCAL_REQUEST_LIFECYCLE_PROOF_SECRET"
          ALLOWED_ORIGINS = "http://127.0.0.1:8787"
          EOF
          printf 'MONGODB_URI="%s"\n' "$MONGODB_URI" > .dev.vars
          chmod 600 .dev.vars
          npx wrangler dev --local --config wrangler-lifecycle.toml --port 8787 --ip 127.0.0.1 >"$RUNNER_TEMP/request-lifecycle.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/request-lifecycle.pid"
          for i in $(seq 1 60); do curl -fsS --max-time 2 http://127.0.0.1:8787/api/status >/dev/null 2>&1 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/request-lifecycle.log"; exit 1

      - name: Prove complete multi-request auth lifecycle
        id: lifecycle
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const origin='http://127.0.0.1:8787';
          const suffix=`${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;
          const username=`lifecycle_${suffix}`.slice(0,32),email=`${username}@example.test`,password=`Old!${suffix}aA9`,newPassword=`New!${suffix}zZ8`;
          fs.writeFileSync(process.env.RUNNER_TEMP+'/lifecycle-user.txt',username);
          async function post(path,body={},token='',expected=[200]){
            const headers={'content-type':'application/json',accept:'application/json'};if(token)headers.authorization=`Bearer ${token}`;
            const r=await fetch(origin+path,{method:'POST',headers,body:JSON.stringify(body)});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{d={raw:raw.slice(0,300)}};
            console.log(JSON.stringify({path,status:r.status,ok:d?.ok??null,error:d?.error??null}));
            if(!expected.includes(r.status))throw new Error(`${path}:HTTP_${r.status}:${String(d?.error||'')}`);return d;
          }
          const reg=await post('/api/auth/register',{username,password,displayName:'Lifecycle Proof',email},'', [201]);
          if(!(reg.ok&&reg.token&&reg.recoveryCode&&reg.account?.email===email))throw new Error('REGISTER_INVALID');
          const login=await post('/api/auth/login',{identifier:username,password});if(!(login.ok&&login.token))throw new Error('LOGIN_INVALID');
          const me=await post('/api/auth/me',{},login.token);if(me.account?.username!==username||me.account?.email!==email)throw new Error('ME_INVALID');
          const rotated=await post('/api/auth/recovery-code',{},login.token);if(!(rotated.ok&&rotated.recoveryCode))throw new Error('ROTATE_INVALID');
          const recovered=await post('/api/auth/recover',{identifier:email,recoveryCode:rotated.recoveryCode,newPassword});if(!(recovered.ok&&recovered.recovered===true))throw new Error('RECOVER_INVALID');
          await post('/api/auth/login',{identifier:username,password},'', [401]);
          const login2=await post('/api/auth/login',{identifier:email,password:newPassword});if(!(login2.ok&&login2.token))throw new Error('NEW_LOGIN_INVALID');
          const del=await post('/api/auth/delete-account',{},login2.token);if(del.deleted!==true)throw new Error('DELETE_INVALID');
          await post('/api/auth/me',{},login2.token,[401]);
          console.log('PASS_REQUEST_SCOPED_MONGODB_FULL_AUTH_LIFECYCLE');
          NODE

      - name: Stop workerd and clean diagnostic account
        if: always()
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/request-lifecycle.pid" ]; then kill "$(cat "$RUNNER_TEMP/request-lifecycle.pid")" >/dev/null 2>&1 || true; fi
          rm -f .dev.vars wrangler-lifecycle.toml
          if [ -f "$RUNNER_TEMP/lifecycle-user.txt" ]; then
            user="$(cat "$RUNNER_TEMP/lifecycle-user.txt")"
            DIAG_USER="$user" node --input-type=module <<'NODE'
          import { MongoClient } from 'mongodb';
          const c=new MongoClient(process.env.MONGODB_URI,{serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});await c.connect();
          try{const db=c.db('naruto_shinobi_no_sho'),u=await db.collection('users').findOne({username:process.env.DIAG_USER},{projection:{_id:1}});if(u?._id){await Promise.all([db.collection('sessions').deleteMany({userId:u._id}),db.collection('recovery_codes').deleteMany({userId:u._id}),db.collection('mechanical_profiles').deleteMany({userId:u._id}),db.collection('audit_events').deleteMany({userId:u._id}),db.collection('users').deleteOne({_id:u._id})]);console.log('PASS_REQUEST_LIFECYCLE_CLEANUP');}}finally{await c.close();}
          NODE
          fi

      - name: Publish only after full lifecycle proof
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/r41-api/src/mongo-request.js cloudflare/r41-api/src/index.js cloudflare/r41-api/src/entry.js cloudflare/r41-api/src/entry-authoritative.js cloudflare/r41-api/test/cloudflare-runtime-contract.test.mjs cloudflare/r41-api/package.json
          git diff --cached --check
          git commit -m 'fix: scope MongoDB connections to each Worker request'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
