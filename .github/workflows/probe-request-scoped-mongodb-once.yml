name: Probe Request Scoped MongoDB Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-request-scoped-mongodb-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            cloudflare/r41-api
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install and clean known diagnostic users
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --input-type=module <<'NODE'
          import { MongoClient } from 'mongodb';
          const client=new MongoClient(process.env.MONGODB_URI,{serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});await client.connect();
          try{
            const db=client.db('naruto_shinobi_no_sho');
            const rows=await db.collection('users').find({username:{$regex:/^(?:publish_|authfix_|authdiag_|e2e_fix_|logindiag_|scopeprobe_)/}},{projection:{_id:1}}).toArray();
            const ids=rows.map(x=>x._id);
            if(ids.length){await Promise.all([
              db.collection('sessions').deleteMany({userId:{$in:ids}}),
              db.collection('recovery_codes').deleteMany({userId:{$in:ids}}),
              db.collection('mechanical_profiles').deleteMany({userId:{$in:ids}}),
              db.collection('saves').deleteMany({userId:{$in:ids}}),
              db.collection('audit_events').deleteMany({userId:{$in:ids}}),
              db.collection('users').deleteMany({_id:{$in:ids}})
            ]);}
            console.log(JSON.stringify({status:'PASS_SCOPE_PROBE_PRE_CLEANUP',deleted:ids.length}));
          }finally{await client.close();}
          NODE

      - name: Apply known auth fixes and disable cross-request MongoClient reuse
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Known proven fixes.
          p=Path('src/entry-authoritative.js');s=p.read_text(encoding='utf-8')
          old='try{await profiles.dropIndex("uq_mechanical_profile_user");}catch(e){if(Number(e?.code)!==27&&String(e?.codeName||"")!=="IndexNotFound")throw e;}'
          new='try{await profiles.dropIndex("uq_mechanical_profile_user");}catch(e){const code=Number(e?.code),codeName=String(e?.codeName||"");if(code!==26&&code!==27&&codeName!=="NamespaceNotFound"&&codeName!=="IndexNotFound")throw e;}'
          if old not in s: raise SystemExit('authority dropIndex block missing')
          s=s.replace(old,new,1)
          old_db='async function db(env){\n  if(!env.MONGODB_URI)throw new Error("MONGODB_URI_MISSING");\n  if(!client||clientUri!==env.MONGODB_URI){clientUri=env.MONGODB_URI;client=new MongoClient(env.MONGODB_URI,{maxPoolSize:4,minPoolSize:0,maxIdleTimeMS:45000,serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});await client.connect();authorityIndexesPromise=null;}\n  const store=client.db(env.MONGODB_DB||"naruto_shinobi_no_sho");await ensureAuthorityIndexes(store);return store;\n}'
          new_db='async function db(env){\n  if(!env.MONGODB_URI)throw new Error("MONGODB_URI_MISSING");\n  const requestClient=new MongoClient(env.MONGODB_URI,{maxPoolSize:1,minPoolSize:0,maxIdleTimeMS:0,serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});\n  await requestClient.connect();\n  authorityIndexesPromise=null;\n  const store=requestClient.db(env.MONGODB_DB||"naruto_shinobi_no_sho");\n  await ensureAuthorityIndexes(store);\n  return store;\n}'
          if old_db not in s: raise SystemExit('authority db accessor missing')
          p.write_text(s.replace(old_db,new_db,1),encoding='utf-8',newline='\n')

          p=Path('src/index.js');s=p.read_text(encoding='utf-8')
          for old,new in {
            'iterations=210000':'iterations=100000','passIter:210000':'passIter:100000',
            'hashPassword(recoveryCode,recoverySalt,120000)':'hashPassword(recoveryCode,recoverySalt,100000)',
            'iterations:120000':'iterations:100000','u.passIter||210000':'u.passIter||100000','rc.iterations||120000':'rc.iterations||100000'
          }.items():
            if old not in s: raise SystemExit(f'missing index literal {old}')
            s=s.replace(old,new)
          old_mongo='async function mongo(env){\n  if(!env.MONGODB_URI)throw new Error("MONGODB_URI_MISSING");\n  if(!sharedClient || sharedUri!==env.MONGODB_URI){sharedUri=env.MONGODB_URI;sharedClient=new MongoClient(env.MONGODB_URI,{maxPoolSize:6,minPoolSize:0,maxIdleTimeMS:45000,serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});await sharedClient.connect();indexesPromise=null;}\n  return sharedClient.db(env.MONGODB_DB||"naruto_shinobi_r41");\n}'
          new_mongo='async function mongo(env){\n  if(!env.MONGODB_URI)throw new Error("MONGODB_URI_MISSING");\n  const requestClient=new MongoClient(env.MONGODB_URI,{maxPoolSize:1,minPoolSize:0,maxIdleTimeMS:0,serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});\n  await requestClient.connect();\n  indexesPromise=null;\n  return requestClient.db(env.MONGODB_DB||"naruto_shinobi_r41");\n}'
          if old_mongo not in s: raise SystemExit('base mongo accessor missing')
          p.write_text(s.replace(old_mongo,new_mongo,1),encoding='utf-8',newline='\n')

          p=Path('src/entry.js');s=p.read_text(encoding='utf-8')
          if 'iterations=120000' not in s: raise SystemExit('entry iteration missing')
          s=s.replace('iterations=120000','iterations=100000')
          old_guard='async function guardDb(env){if(!env.MONGODB_URI)throw new Error("MONGODB_URI_MISSING");if(!guardClient||guardUri!==env.MONGODB_URI){guardUri=env.MONGODB_URI;guardClient=new MongoClient(env.MONGODB_URI,{maxPoolSize:3,minPoolSize:0,maxIdleTimeMS:45000,serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});await guardClient.connect();guardIndex=null;}const db=guardClient.db(env.MONGODB_DB||"naruto_shinobi_r41");if(!guardIndex)guardIndex=db.collection("room_memberships").createIndex({roomId:1,userId:1},{unique:true,name:"uq_room_membership"}).catch(e=>{guardIndex=null;throw e;});await guardIndex;return db;}'
          new_guard='async function guardDb(env){if(!env.MONGODB_URI)throw new Error("MONGODB_URI_MISSING");const requestClient=new MongoClient(env.MONGODB_URI,{maxPoolSize:1,minPoolSize:0,maxIdleTimeMS:0,serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});await requestClient.connect();guardIndex=null;const db=requestClient.db(env.MONGODB_DB||"naruto_shinobi_r41");guardIndex=db.collection("room_memberships").createIndex({roomId:1,userId:1},{unique:true,name:"uq_room_membership"}).catch(e=>{guardIndex=null;throw e;});await guardIndex;return db;}'
          if old_guard not in s: raise SystemExit('guard db accessor missing')
          p.write_text(s.replace(old_guard,new_guard,1),encoding='utf-8',newline='\n')
          PY
          npm run check

      - name: Start local workerd with fresh MongoDB clients
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler-scope-probe.toml <<'EOF'
          name = "shinobi-scope-probe"
          main = "src/entry-authoritative.js"
          compatibility_date = "2026-08-19"
          compatibility_flags = ["nodejs_compat", "no_throw_on_not_implemented_tls_options"]
          [vars]
          MONGODB_DB = "naruto_shinobi_no_sho"
          AUTH_SECRET = "LOCAL_SCOPE_PROBE_AUTH_SECRET"
          ALLOWED_ORIGINS = "http://127.0.0.1:8787"
          EOF
          printf 'MONGODB_URI="%s"\n' "$MONGODB_URI" > .dev.vars
          chmod 600 .dev.vars
          npx wrangler dev --local --config wrangler-scope-probe.toml --port 8787 --ip 127.0.0.1 >"$RUNNER_TEMP/scope-probe.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/scope-probe.pid"
          for i in $(seq 1 60); do curl -fsS --max-time 2 http://127.0.0.1:8787/api/status >/dev/null 2>&1 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/scope-probe.log"; exit 1

      - name: Prove register then login no longer hangs
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${RANDOM}"; username="scopeprobe_${suffix}"; username="${username:0:32}"; email="${username}@example.test"; password="Diag!${GITHUB_RUN_ID}aA9"
          echo "$username" > "$RUNNER_TEMP/scope-probe-user.txt"
          USER="$username" EMAIL="$email" PASS="$password" node --input-type=module <<'NODE'
          const origin='http://127.0.0.1:8787';
          const username=process.env.USER,email=process.env.EMAIL,password=process.env.PASS;
          async function post(path,body){const r=await fetch(origin+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{d={raw:text.slice(0,500)}};return {status:r.status,data:d};}
          const reg=await post('/api/auth/register',{username,password,displayName:'Scope Probe',email});
          console.log(JSON.stringify({step:'register',status:reg.status,ok:reg.data?.ok===true,error:reg.data?.error||null}));
          if(reg.status!==201||reg.data?.ok!==true)throw new Error(`REGISTER_FAILED_${reg.status}`);
          const login=await post('/api/auth/login',{identifier:username,password});
          console.log(JSON.stringify({step:'login',status:login.status,ok:login.data?.ok===true,error:login.data?.error||null,hasToken:Boolean(login.data?.token)}));
          if(login.status!==200||login.data?.ok!==true||!login.data?.token)throw new Error(`LOGIN_STILL_FAILED_${login.status}`);
          console.log('PASS_REQUEST_SCOPED_MONGODB_REGISTER_LOGIN');
          NODE

      - name: Clean probe account and stop workerd
        if: always()
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/scope-probe.pid" ]; then kill "$(cat "$RUNNER_TEMP/scope-probe.pid")" >/dev/null 2>&1 || true; fi
          rm -f .dev.vars wrangler-scope-probe.toml
          if [ -f "$RUNNER_TEMP/scope-probe-user.txt" ]; then
            user="$(cat "$RUNNER_TEMP/scope-probe-user.txt")"
            DIAG_USER="$user" node --input-type=module <<'NODE'
          import { MongoClient } from 'mongodb';
          const c=new MongoClient(process.env.MONGODB_URI,{serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});await c.connect();
          try{const db=c.db('naruto_shinobi_no_sho'),u=await db.collection('users').findOne({username:process.env.DIAG_USER},{projection:{_id:1}});if(u?._id){await Promise.all([db.collection('sessions').deleteMany({userId:u._id}),db.collection('recovery_codes').deleteMany({userId:u._id}),db.collection('mechanical_profiles').deleteMany({userId:u._id}),db.collection('audit_events').deleteMany({userId:u._id}),db.collection('users').deleteOne({_id:u._id})]);console.log('PASS_SCOPE_PROBE_CLEANUP');}}finally{await c.close();}
          NODE
          fi
