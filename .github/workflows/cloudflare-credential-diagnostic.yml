name: Cloudflare Credential Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-credential-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Classify Cloudflare credential non-sensitively
        shell: bash
        run: |
          set -euo pipefail
          token="${CLOUDFLARE_API_TOKEN:-}"
          account="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$token" ]; then
            echo 'CF_DIAG tokenPresent=false tokenActive=false configuredAccountPresent=false configuredWorkersAccess=false accountsListAccess=false accessibleWorkersAccounts=0 classification=TOKEN_MISSING'
            exit 0
          fi

          request() {
            local url="$1" out="$2"
            curl -sS --max-time 30 -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "$url" > "$out" || printf '%s' '{}' > "$out"
          }

          request 'https://api.cloudflare.com/client/v4/user/tokens/verify' /tmp/cf-token.json
          request 'https://api.cloudflare.com/client/v4/accounts?per_page=50' /tmp/cf-accounts.json
          if [ -n "$account" ]; then
            request "https://api.cloudflare.com/client/v4/accounts/$account/workers/scripts" /tmp/cf-workers-configured.json
          else
            printf '%s' '{}' > /tmp/cf-workers-configured.json
          fi

          TOKEN_FILE=/tmp/cf-token.json ACCOUNTS_FILE=/tmp/cf-accounts.json WORKERS_FILE=/tmp/cf-workers-configured.json ACCOUNT_PRESENT="$([ -n "$account" ] && echo true || echo false)" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=(p)=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};
          const codes=(d)=>Array.isArray(d?.errors)?d.errors.map(x=>String(x?.code??'')).filter(Boolean):[];
          const token=read(process.env.TOKEN_FILE);
          const accounts=read(process.env.ACCOUNTS_FILE);
          const workers=read(process.env.WORKERS_FILE);
          const tokenActive=token?.success===true && String(token?.result?.status||'').toLowerCase()==='active';
          const accountsListAccess=accounts?.success===true && Array.isArray(accounts?.result);
          const configuredAccountPresent=process.env.ACCOUNT_PRESENT==='true';
          const configuredWorkersAccess=configuredAccountPresent && workers?.success===true;
          const result={
            tokenPresent:true,
            tokenActive,
            configuredAccountPresent,
            configuredWorkersAccess,
            accountsListAccess,
            accountCount:accountsListAccess?accounts.result.length:0,
            tokenErrorCodes:codes(token),
            accountsErrorCodes:codes(accounts),
            configuredWorkersErrorCodes:codes(workers)
          };
          let classification='UNKNOWN';
          if(!tokenActive) classification='TOKEN_INACTIVE_OR_INVALID';
          else if(configuredWorkersAccess) classification='CONFIGURED_ACCOUNT_WORKERS_OK';
          else if(!configuredAccountPresent) classification='ACCOUNT_ID_MISSING';
          else classification='TOKEN_ACTIVE_BUT_CONFIGURED_WORKERS_DENIED';
          console.log('CF_DIAG '+Object.entries({...result,classification}).map(([k,v])=>`${k}=${Array.isArray(v)?(v.join(',')||'none'):v}`).join(' '));
          fs.writeFileSync('/tmp/cf-diag-base.json',JSON.stringify({result,classification,accounts:accountsListAccess?accounts.result.map(x=>String(x?.id||'')).filter(Boolean):[]})+'\n');
          NODE

          accessible=0
          if [ -s /tmp/cf-diag-base.json ]; then
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              request "https://api.cloudflare.com/client/v4/accounts/$candidate/workers/scripts" /tmp/cf-workers-candidate.json
              ok="$(node --input-type=module -e "import fs from 'node:fs';let d={};try{d=JSON.parse(fs.readFileSync('/tmp/cf-workers-candidate.json','utf8'))}catch{};process.stdout.write(d.success===true?'true':'false')")"
              if [ "$ok" = true ]; then accessible=$((accessible+1)); fi
            done < <(node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('/tmp/cf-diag-base.json','utf8'));for(const id of d.accounts||[])console.log(id)")
          fi
          echo "CF_DIAG accessibleWorkersAccounts=$accessible"
