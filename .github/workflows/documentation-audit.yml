name: Documentacao tecnica integral

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/generated/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: technical-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned AST parser
        run: npm install --no-save --ignore-scripts acorn@8.15.0

      - name: Check documentation tools syntax
        run: |
          node --check tools/generate-technical-spec.mjs
          node --check tools/ast-index-functions.mjs
          node --check tools/refine-technical-spec.mjs
          node --check tools/ast-enrich-technical-spec.mjs
          node --check tools/audit-documentation-coverage.mjs

      - name: Generate repository inventory
        run: node tools/generate-technical-spec.mjs

      - name: Build exact AST function index
        run: node tools/ast-index-functions.mjs

      - name: Separate game runtime semantics from tooling
        run: node tools/refine-technical-spec.mjs

      - name: Enrich exact AST behavior and crosswalks
        run: node tools/ast-enrich-technical-spec.mjs

      - name: Report unresolved concrete UI mappings
        run: |
          node - <<'NODE'
          const i=require('./docs/generated/TECHNICAL-INVENTORY.json');
          const u=(i.uiActionCrosswalk||[]).filter(x=>!x.dynamicTemplate&&!x.handlerCandidates.length);
          console.log('UNRESOLVED_CONCRETE_UI_COUNT='+u.length);
          for(const x of u) console.log(JSON.stringify({id:x.id,action:x.action,status:x.status,sources:x.sources,emitters:x.emitterFunctions,mentions:x.mentionFunctions}));
          const esc=(i.functions||[]).find(f=>f.file==='app.js'&&f.name==='esc');
          console.log('ESC_AST_SANITY='+JSON.stringify(esc?{id:esc.id,line:esc.line,endLine:esc.endLine,calls:esc.calls,handlers:esc.ast.handlerLiterals,bodySha:esc.ast.bodySha256}:null));
          NODE

      - name: Audit AST documentation coverage
        run: node tools/audit-documentation-coverage.mjs

      - name: Validate generated files and gates
        run: |
          for f in \
            TECHNICAL-INVENTORY.json 00-INVENTORY-SUMMARY.md 01-FUNCTIONS.md 02-API.md 03-AI.md \
            04-PERSISTENCE.md 05-UI-INTERACTIONS.md 06-SCRIPTS.md 07-MOVEMENT-ACTIONS.md 08-TRACEABILITY.md \
            09-DOCUMENTATION-AUDIT.md 10-ASSET-REFERENCES.md 11-FUNCTION-BEHAVIORS.md 12-UI-ACTION-CROSSWALK.md \
            13-API-CONTRACT-EVIDENCE.md 14-PERSISTENCE-OPERATIONS.md 15-SCRIPT-RESPONSIBILITIES.md \
            16-MOVEMENT-FUNCTIONS.md 17-INTERACTION-MATRIX.md 18-AST-FUNCTION-INDEX.md 19-UNRESOLVED-UI-ACTIONS.md \
            DOCUMENTATION-AUDIT.json; do test -s "docs/generated/$f"; done
          node - <<'NODE'
          const r=require('./docs/generated/DOCUMENTATION-AUDIT.json');
          if(!r.ok||r.status!=='PASS_AST_STATIC_DOCUMENTATION'||r.gates.astParsing!=='PASS'||r.gates.functionBehaviorDocumentation!=='PASS'||r.gates.runtimeSemanticIsolation!=='PASS') process.exit(1);
          console.log(r.staticCoverage,r.modelNames,r.gates);
          NODE

      - name: Commit generated documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated
          if git diff --cached --quiet; then
            echo 'Generated documentation is already current.'
          else
            git commit -m 'docs: regenerate exact AST technical documentation'
            git push
          fi
