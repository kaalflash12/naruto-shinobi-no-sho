name: Documentacao tecnica integral

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/generated/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: technical-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned AST parser
        run: npm install --no-save --ignore-scripts acorn@8.15.0

      - name: Check documentation tools syntax
        run: |
          node --check tools/generate-technical-spec.mjs
          node --check tools/ast-index-functions.mjs
          node --check tools/refine-technical-spec.mjs
          node --check tools/audit-documentation-coverage.mjs
          node --check tools/build-final-canonical-spec-ast.mjs
          node --check tools/audit-final-canonical-spec.mjs

      - name: Generate exhaustive source inventory
        run: node tools/generate-technical-spec.mjs

      - name: Replace heuristic function inventory with exact AST index
        run: node tools/ast-index-functions.mjs

      - name: Separate game runtime semantics from tooling
        run: node tools/refine-technical-spec.mjs

      - name: Audit documentation coverage
        run: node tools/audit-documentation-coverage.mjs

      - name: Build single canonical full specification from AST
        run: node tools/build-final-canonical-spec-ast.mjs

      - name: Validate generated files and static gates
        run: |
          test -s docs/generated/TECHNICAL-INVENTORY.json
          test -s docs/generated/18-AST-FUNCTION-INDEX.md
          test -s docs/generated/00-INVENTORY-SUMMARY.md
          test -s docs/generated/01-FUNCTIONS.md
          test -s docs/generated/02-API.md
          test -s docs/generated/03-AI.md
          test -s docs/generated/04-PERSISTENCE.md
          test -s docs/generated/05-UI-INTERACTIONS.md
          test -s docs/generated/06-SCRIPTS.md
          test -s docs/generated/07-MOVEMENT-ACTIONS.md
          test -s docs/generated/08-TRACEABILITY.md
          test -s docs/generated/09-DOCUMENTATION-AUDIT.md
          test -s docs/generated/10-ASSET-REFERENCES.md
          test -s docs/generated/DOCUMENTATION-AUDIT.json
          test -s docs/generated/NARUTO_SHINOBI_NO_SHO_ESPECIFICACAO_FINAL_COMPLETA.md
          test -s docs/generated/FINAL-CANONICAL-AUDIT.json
          node - <<'NODE'
          const r=require('./docs/generated/DOCUMENTATION-AUDIT.json');
          const inv=require('./docs/generated/TECHNICAL-INVENTORY.json');
          if(!r.ok||r.status!=='PASS_STATIC_COVERAGE'||r.discoveryMode!=='runtime-semantics-plus-tooling-functions'||r.semanticDiscovery!=='game-runtime-only'||r.gates.documentationExcludedFromDiscovery!=='PASS'||r.gates.toolingExcludedFromGameSemantics!=='PASS') process.exit(1);
          if(!inv.astIndex||inv.astIndex.parser!=='acorn'||inv.astIndex.parseFailures!==0) process.exit(1);
          console.log({coverage:r.staticCoverage,models:r.modelNames,astFunctions:inv.astIndex.functions,callbacks:inv.astIndex.callbackFunctions});
          NODE

      - name: Commit generated documentation and canonical report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated
          if git diff --cached --quiet; then
            echo 'Generated documentation is already current.'
          else
            git commit -m 'docs: regenerate canonical full specification'
            git push
          fi

      - name: Enforce final canonical specification gate
        run: node tools/audit-final-canonical-spec.mjs
