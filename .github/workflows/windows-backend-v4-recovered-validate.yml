name: Windows Backend V4 Recovered Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recover exact embedded V4 payload
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $workflow = [IO.File]::ReadAllText(".github/workflows/windows-backend-v4-exact.yml")
          $marker = '$b64 = @'''
          $start = $workflow.IndexOf($marker, [StringComparison]::Ordinal)
          if ($start -lt 0) { throw "Nao consegui localizar o inicio do payload base64 da V4." }
          $bodyStart = $start + $marker.Length
          $finish = $workflow.IndexOf("'@", $bodyStart, [StringComparison]::Ordinal)
          if ($finish -lt 0) { throw "Nao consegui localizar o fim do payload base64 da V4." }
          $b64 = ($workflow.Substring($bodyStart, $finish - $bodyStart) -replace '\s','')
          if ([string]::IsNullOrWhiteSpace($b64)) { throw "Payload base64 V4 vazio." }
          $gzPath = Join-Path $env:RUNNER_TEMP "backend-v4-recovered.ps1.gz"
          $ps1Path = Join-Path $env:RUNNER_TEMP "ATIVAR_BACKEND_SHINOBI_SEM_INSTALAR_NADA_V4.ps1"
          [IO.File]::WriteAllBytes($gzPath, [Convert]::FromBase64String($b64))
          $input = [IO.File]::OpenRead($gzPath)
          try {
            $gzip = New-Object IO.Compression.GZipStream($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($ps1Path)
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }
          if (-not (Test-Path -LiteralPath $ps1Path -PathType Leaf)) { throw "V4 nao foi reconstruida." }
          $sha = (Get-FileHash -LiteralPath $ps1Path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "[VERIFIED] exact embedded V4 SHA256 before patch: $sha"

          $text = [IO.File]::ReadAllText($ps1Path)
          $needle = '[Parameter(Mandatory=$true)][string[]]$ArgumentList'
          $replacement = '[Parameter(Mandatory=$true)][AllowEmptyCollection()][string[]]$ArgumentList'
          if (-not $text.Contains($needle)) { throw "Nao encontrei o parametro ArgumentList obrigatorio para corrigir." }
          $text = $text.Replace($needle,$replacement)
          [IO.File]::WriteAllText($ps1Path,$text,(New-Object System.Text.UTF8Encoding($false)))
          $patchedSha = (Get-FileHash -LiteralPath $ps1Path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "[VERIFIED] patched V4 SHA256: $patchedSha"
          "V4_PATH=$ps1Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

      - name: Windows PowerShell 5.1 parser gate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($env:V4_PATH,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host ("Line {0}, col {1}: {2}" -f $_.Extent.StartLineNumber,$_.Extent.StartColumnNumber,$_.Message) }
            throw "PowerShell 5.1 parser found $($errors.Count) error(s)."
          }
          Write-Host "[PASS] Windows PowerShell 5.1 parser: 0 errors"

      - name: Execute patched exact V4 PreflightOnly
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $env:V4_PATH -PreflightOnly
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "Patched exact V4 PreflightOnly failed with exit $code" }
          Write-Host "[PASS] patched exact V4 PreflightOnly exit 0"

      - name: Upload corrected V4 candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-backend-v4-windows-candidate
          path: ${{ env.V4_PATH }}
          if-no-files-found: error
