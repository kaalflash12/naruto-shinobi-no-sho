name: Cloudflare Bootstrap PowerShell

# Validation-only workflow: this comment is outside the release fingerprint.
on:
  pull_request:
    branches: [main]
    paths:
      - 'ATIVAR-TUDO.cmd'
      - 'ATIVAR-CLOUDFLARE-LIVE.ps1'
      - 'tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1'
      - '.github/workflows/cloudflare-bootstrap-syntax.yml'
  push:
    branches: [main]
    paths:
      - 'ATIVAR-TUDO.cmd'
      - 'ATIVAR-CLOUDFLARE-LIVE.ps1'
      - 'tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1'
      - '.github/workflows/cloudflare-bootstrap-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Parse bootstrap with Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            (Join-Path $PWD 'ATIVAR-CLOUDFLARE-LIVE.ps1'),
            (Join-Path $PWD 'tools\ATIVAR-CLOUDFLARE-LIVE-V3.ps1')
          )
          foreach ($path in $paths) {
            if (-not (Test-Path $path)) { throw "PowerShell ausente: $path" }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed em ${path}: $($errors.Count) error(s)"
            }
          }
          Write-Host 'PASS_CLOUDFLARE_BOOTSTRAP_POWERSHELL_PARSE'

      - name: Reproduce and block createdAt Object[] regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'tools\ATIVAR-CLOUDFLARE-LIVE-V3.ps1'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $path -ValidateRunParsing
          if ($LASTEXITCODE -ne 0) { throw "createdAt regression test falhou: $LASTEXITCODE" }
          Write-Host 'PASS_GITHUB_RUN_CREATEDAT_ARRAY_GATE'

      - name: Enforce zero-paste bootstrap
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'tools\ATIVAR-CLOUDFLARE-LIVE-V3.ps1'
          $source = Get-Content $path -Raw
          if ($source -match '(?i)Read-Host\s+[''\"]CLOUDFLARE_API_TOKEN') { throw 'Cloudflare token manual prompt voltou.' }
          if ($source -match '(?i)Read-Host\s+[''\"]MONGODB_URI') { throw 'MongoDB URI manual prompt voltou.' }
          if ($source -match '(?i)Read-Host\s+[''\"]Numero da conta') { throw 'Selecao manual de conta Cloudflare voltou.' }
          if ($source -match '\(\[DateTime\]\$_\.createdAt\)') { throw 'Cast fragil de createdAt voltou.' }
          if ($source -notmatch 'Convert-GhCreatedAtUtc') { throw 'Normalizacao robusta de createdAt ausente.' }
          if ($source -notmatch "wrangler@4\.119\.0' login --device") { throw 'Wrangler device OAuth ausente.' }
          if ($source -notmatch "wrangler@4\.119\.0' auth token --json") { throw 'Captura automatica da credencial Wrangler ausente.' }
          if ($source -notmatch 'Get-MongoUriAutomatic') { throw 'Provisionamento MongoDB automatico ausente.' }
          if ($source -notmatch 'PASS_FINAL_READINESS') { throw 'Gate final ausente.' }
          Write-Host 'PASS_CLOUDFLARE_BOOTSTRAP_ZERO_PASTE'

      - name: Validate one-click launcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'ATIVAR-TUDO.cmd'
          if (-not (Test-Path $path)) { throw 'Launcher ATIVAR-TUDO.cmd ausente.' }
          $source = Get-Content $path -Raw
          if ($source -match '(?i)\bset\s+/p\b|\bchoice\b|Read-Host|CLOUDFLARE_API_TOKEN|MONGODB_URI') { throw 'Launcher voltou a exigir entrada manual sensivel.' }
          if ($source -notmatch 'ATIVAR-CLOUDFLARE-LIVE\.ps1') { throw 'Launcher nao chama o bootstrap canonico.' }
          if ($source -notmatch 'Invoke-WebRequest') { throw 'Launcher nao baixa a versao atual do bootstrap.' }
          if ($source -notmatch '--validate-only') { throw 'Modo de validacao do launcher ausente.' }
          & $env:ComSpec /d /c "`"$path`" --validate-only"
          if ($LASTEXITCODE -ne 0) { throw "Launcher validate-only falhou: $LASTEXITCODE" }
          Write-Host 'PASS_ONE_CLICK_LIVE_LAUNCHER_GATE'
