name: Diagnose Local Workerd Login Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-local-workerd-login-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            cloudflare/r41-api
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install and clean prior diagnostic users
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --input-type=module <<'NODE'
          import { MongoClient } from 'mongodb';
          const client=new MongoClient(process.env.MONGODB_URI,{serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});
          await client.connect();
          try{
            const db=client.db('naruto_shinobi_no_sho');
            const rows=await db.collection('users').find({username:{$regex:/^(?:publish_|authfix_|authdiag_|e2e_fix_|logindiag_)/}},{projection:{_id:1}}).toArray();
            const ids=rows.map(x=>x._id);
            if(ids.length){await Promise.all([
              db.collection('sessions').deleteMany({userId:{$in:ids}}),
              db.collection('recovery_codes').deleteMany({userId:{$in:ids}}),
              db.collection('mechanical_profiles').deleteMany({userId:{$in:ids}}),
              db.collection('saves').deleteMany({userId:{$in:ids}}),
              db.collection('audit_events').deleteMany({userId:{$in:ids}}),
              db.collection('users').deleteMany({_id:{$in:ids}})
            ]);}
            console.log(JSON.stringify({status:'PASS_LOGIN_DIAGNOSTIC_PRE_CLEANUP',deleted:ids.length}));
          }finally{await client.close();}
          NODE
      - name: Apply known runtime fixes locally
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/entry-authoritative.js');s=p.read_text(encoding='utf-8')
          old='try{await profiles.dropIndex("uq_mechanical_profile_user");}catch(e){if(Number(e?.code)!==27&&String(e?.codeName||"")!=="IndexNotFound")throw e;}'
          new='try{await profiles.dropIndex("uq_mechanical_profile_user");}catch(e){const code=Number(e?.code),codeName=String(e?.codeName||"");if(code!==26&&code!==27&&codeName!=="NamespaceNotFound"&&codeName!=="IndexNotFound")throw e;}'
          if old not in s: raise SystemExit('authority block missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          p=Path('src/index.js');s=p.read_text(encoding='utf-8')
          for old,new in {
            'iterations=210000':'iterations=100000','passIter:210000':'passIter:100000',
            'hashPassword(recoveryCode,recoverySalt,120000)':'hashPassword(recoveryCode,recoverySalt,100000)',
            'iterations:120000':'iterations:100000','u.passIter||210000':'u.passIter||100000','rc.iterations||120000':'rc.iterations||100000'
          }.items():
            if old not in s: raise SystemExit(f'missing index literal {old}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8',newline='\n')
          p=Path('src/entry.js');s=p.read_text(encoding='utf-8')
          if 'iterations=120000' not in s: raise SystemExit('entry iteration missing')
          p.write_text(s.replace('iterations=120000','iterations=100000'),encoding='utf-8',newline='\n')
          PY
          npm run check
      - name: Start local workerd
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler-login-diag.toml <<'EOF'
          name = "shinobi-login-diagnostic"
          main = "src/entry-authoritative.js"
          compatibility_date = "2026-08-19"
          compatibility_flags = ["nodejs_compat", "no_throw_on_not_implemented_tls_options"]
          [vars]
          MONGODB_DB = "naruto_shinobi_no_sho"
          AUTH_SECRET = "LOCAL_LOGIN_DIAGNOSTIC_AUTH_SECRET"
          ALLOWED_ORIGINS = "http://127.0.0.1:8787"
          EOF
          printf 'MONGODB_URI="%s"\n' "$MONGODB_URI" > .dev.vars
          chmod 600 .dev.vars
          npx wrangler dev --local --config wrangler-login-diag.toml --port 8787 --ip 127.0.0.1 >"$RUNNER_TEMP/login-workerd.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/login-workerd.pid"
          for i in $(seq 1 60); do curl -fsS --max-time 2 http://127.0.0.1:8787/api/status >/dev/null 2>&1 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/login-workerd.log"; exit 1
      - name: Register then capture login result
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${RANDOM}"; username="logindiag_${suffix}"; username="${username:0:32}"; email="${username}@example.test"; password="Diag!${GITHUB_RUN_ID}aA9"
          echo "$username" > "$RUNNER_TEMP/login-diag-user.txt"
          payload="$(USER="$username" EMAIL="$email" PASS="$password" node --input-type=module <<'NODE'
          process.stdout.write(JSON.stringify({username:process.env.USER,password:process.env.PASS,displayName:'Login Diagnostic',email:process.env.EMAIL}));
          NODE
          )"
          reg_file="$RUNNER_TEMP/login-reg.json"
          reg_code="$(curl -sS --max-time 30 -o "$reg_file" -w '%{http_code}' -X POST http://127.0.0.1:8787/api/auth/register -H 'content-type: application/json' --data "$payload" || true)"
          echo "REGISTER_HTTP=$reg_code"
          test "$reg_code" = 201
          login_payload="$(USER="$username" PASS="$password" node --input-type=module <<'NODE'
          process.stdout.write(JSON.stringify({identifier:process.env.USER,password:process.env.PASS}));
          NODE
          )"
          login_file="$RUNNER_TEMP/login-response.txt"
          login_code="$(curl -sS --max-time 30 -o "$login_file" -w '%{http_code}' -X POST http://127.0.0.1:8787/api/auth/login -H 'content-type: application/json' --data "$login_payload" || true)"
          sleep 2
          HTTP_CODE="$login_code" RESPONSE_FILE="$login_file" LOG_FILE="$RUNNER_TEMP/login-workerd.log" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const redact=s=>String(s||'').replace(/mongodb(?:\+srv)?:\/\/[^\s"']+/gi,'<redacted-mongodb-uri>').replace(/logindiag_[A-Za-z0-9_-]+/g,'<redacted-username>').replace(/Diag![A-Za-z0-9!_-]+/g,'<redacted-password>').replace(/Bearer\s+\S+/gi,'Bearer <redacted>');
          const response=redact(fs.readFileSync(process.env.RESPONSE_FILE,'utf8')).slice(0,1600);
          const tail=redact(fs.readFileSync(process.env.LOG_FILE,'utf8')).split(/\r?\n/).filter(Boolean).slice(-180);
          console.log(JSON.stringify({status:'LOCAL_WORKERD_LOGIN_DIAGNOSTIC',http:Number(process.env.HTTP_CODE||0),response,tail},null,2));
          NODE
      - name: Clean account and stop workerd
        if: always()
        working-directory: cloudflare/r41-api
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/login-workerd.pid" ]; then kill "$(cat "$RUNNER_TEMP/login-workerd.pid")" >/dev/null 2>&1 || true; fi
          rm -f .dev.vars wrangler-login-diag.toml
          if [ -f "$RUNNER_TEMP/login-diag-user.txt" ]; then
            user="$(cat "$RUNNER_TEMP/login-diag-user.txt")"
            DIAG_USER="$user" node --input-type=module <<'NODE'
          import { MongoClient } from 'mongodb';
          const client=new MongoClient(process.env.MONGODB_URI,{serverSelectionTimeoutMS:6000,connectTimeoutMS:6000});await client.connect();
          try{const db=client.db('naruto_shinobi_no_sho'),u=await db.collection('users').findOne({username:process.env.DIAG_USER},{projection:{_id:1}});if(u?._id){await Promise.all([db.collection('sessions').deleteMany({userId:u._id}),db.collection('recovery_codes').deleteMany({userId:u._id}),db.collection('mechanical_profiles').deleteMany({userId:u._id}),db.collection('audit_events').deleteMany({userId:u._id}),db.collection('users').deleteOne({_id:u._id})]);console.log('PASS_LOGIN_DIAGNOSTIC_CLEANUP');}}finally{await client.close();}
          NODE
          fi
