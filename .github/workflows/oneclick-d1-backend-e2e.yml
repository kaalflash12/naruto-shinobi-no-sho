name: One-click D1 Backend E2E

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/oneclick-backend/**'
      - '.github/workflows/oneclick-d1-backend-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1-backend-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare/oneclick-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies in CI only
        run: npm install --no-audit --no-fund

      - name: JavaScript syntax gate
        run: npm run check

      - name: Wrangler production config dry-run
        run: npx wrangler deploy --dry-run --outdir ../../.tmp/oneclick-worker

      - name: Apply D1 migration locally
        run: npx wrangler d1 migrations apply DB --local --config wrangler.test.jsonc --persist-to=.wrangler-state

      - name: Start local Worker with D1 and Durable Objects
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --config wrangler.test.jsonc --persist-to=.wrangler-state --port 8787 > /tmp/sns-wrangler.log 2>&1 &
          echo $! > /tmp/sns-wrangler.pid
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/status >/tmp/status.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/sns-wrangler.log || true
            exit 1
          fi
          cat /tmp/status.json

      - name: Run real local API E2E
        env:
          BASE_URL: http://127.0.0.1:8787
        run: node test/local-e2e.mjs

      - name: Stop Worker
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/sns-wrangler.pid ]; then kill "$(cat /tmp/sns-wrangler.pid)" 2>/dev/null || true; fi

      - name: Show Wrangler log on failure
        if: failure()
        shell: bash
        run: cat /tmp/sns-wrangler.log || true
