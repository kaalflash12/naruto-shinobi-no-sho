name: Browser Smoke + Live API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'r41-api-config.js'
      - 'r41-github-api.js'
      - 'src/**'
      - 'tools/browser-smoke.mjs'
      - 'tools/browser-live-api.mjs'
      - '.github/workflows/browser-e2e.yml'

permissions:
  contents: write

concurrency:
  group: shinobi-browser-supabase
  cancel-in-progress: false

jobs:
  browser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local HTTP game server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/shinobi-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/shinobi-http.log; exit 1
      - name: Run Chromium smoke
        env:
          BASE_URL: http://127.0.0.1:4173
          BROWSER_REPORT: audit/BROWSER-SMOKE.json
        run: node tools/browser-smoke.mjs
      - name: Run public GitHub Pages to Supabase Chromium probe
        env:
          PUBLIC_GAME_URL: https://kaalflash12.github.io/naruto-shinobi-no-sho/
          API_ORIGIN: https://rlyiwlwzrdgvcwawrnpl.supabase.co/functions/v1/shinobi-api
          BROWSER_LIVE_REPORT: audit/BROWSER-LIVE-API.json
        run: node tools/browser-live-api.mjs
      - name: Enforce reports
        run: |
          node - <<'NODE'
          const s=require('./audit/BROWSER-SMOKE.json'),l=require('./audit/BROWSER-LIVE-API.json');
          if(!s.ok||s.status!=='PASS_BROWSER_SMOKE')throw new Error(JSON.stringify(s.failures||[]));
          if(!l.ok||l.status!=='PASS_BROWSER_LIVE_API')throw new Error(JSON.stringify(l.failures||[]));
          if(l.backendStatus?.data?.storage!=='supabase-postgres')throw new Error('browser live não confirmou Supabase Postgres');
          console.log(s.status,l.status);
          NODE
      - name: Commit browser evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in audit/BROWSER-SMOKE.json audit/BROWSER-LIVE-API.json; do [ -f "$f" ] && git add "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m 'test: record Supabase browser evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-browser-supabase
          path: |
            audit/BROWSER-SMOKE.json
            audit/BROWSER-LIVE-API.json
          if-no-files-found: warn
