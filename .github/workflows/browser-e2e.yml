name: Browser Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'audit/**'
      - 'docs/generated/**'
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: shinobi-browser-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Start local HTTP game server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/shinobi-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/shinobi-http.log; exit 1
      - name: Run Chromium smoke
        env:
          BASE_URL: http://127.0.0.1:4173
          BROWSER_REPORT: audit/BROWSER-SMOKE.json
        run: node tools/browser-smoke.mjs
      - name: Enforce smoke report
        run: |
          node - <<'NODE'
          const s=require('./audit/BROWSER-SMOKE.json');
          if(!s.ok||s.status!=='PASS_BROWSER_SMOKE'||!s.checks?.backendIdentity)throw new Error(JSON.stringify(s.failures||[]));
          if(s.api?.build!=='NARUTO-SHINOBI-NO-SHO-CLOUDFLARE-MONGODB')throw new Error('identidade Cloudflare/MongoDB ausente');
          if(s.api?.liveWorkerTestedElsewhere!==false||s.api?.liveWorkerEvidence!=='UNVERIFIED_BY_LOCAL_SMOKE')throw new Error('smoke local não pode alegar prova de Worker live');
          console.log(s.status,s.api);
          NODE
      - name: Gate V82 to TERION combat pipeline
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tools/browser-combat-local-e2e.mjs
      - name: Gate all 11 gameplay contracts locally
        env:
          PUBLIC_GAME_URL: http://127.0.0.1:4173/
          BROWSER_GAMEPLAY_REPORT: audit/BROWSER-GAMEPLAY-LOCAL-E2E.json
          GAMEPLAY_SCOPE: LOCAL_HTTP_CHROMIUM_WITH_API_FIXTURE
        run: node tools/browser-gameplay-local-e2e.mjs
      - name: Enforce 11 local gameplay contracts
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='audit/BROWSER-GAMEPLAY-LOCAL-E2E.json';
          if(!fs.existsSync(p))throw new Error('LOCAL_GAMEPLAY_REPORT_MISSING');
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.ok!==true||r.status!=='PASS_BROWSER_GAMEPLAY_E2E')throw new Error(`LOCAL_GAMEPLAY_FAILED ${r.status}: ${(r.failures||[]).join(' | ')}`);
          if(r.scope!=='LOCAL_HTTP_CHROMIUM_WITH_API_FIXTURE')throw new Error(`LOCAL_GAMEPLAY_SCOPE_INVALID ${r.scope||'missing'}`);
          if(!Array.isArray(r.contracts)||r.contracts.length<11||r.contracts.some(x=>x.status!=='PASS_GAMEPLAY_E2E'))throw new Error(`LOCAL_GAMEPLAY_CONTRACTS ${r.contracts?.length||0}/11`);
          console.log('PASS_LOCAL_11_GAMEPLAY_CONTRACTS',r.scope,r.contracts.map(x=>x.id).join(','));
          NODE
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-browser-smoke
          path: |
            audit/BROWSER-SMOKE.json
            audit/BROWSER-GAMEPLAY-LOCAL-E2E.json
          if-no-files-found: warn
      - name: Commit verified local browser evidence
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/BROWSER-SMOKE.json audit/BROWSER-GAMEPLAY-LOCAL-E2E.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: record local browser smoke and 11 gameplay contracts'
          git pull --rebase origin main
          git push origin HEAD:main
