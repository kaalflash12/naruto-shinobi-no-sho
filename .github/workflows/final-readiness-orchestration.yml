name: Final Readiness Orchestration

on:
  workflow_run:
    workflows:
      - Account Live E2E - Cloudflare MongoDB
      - Browser Gameplay E2E
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: shinobi-final-readiness-orchestration
  cancel-in-progress: false

jobs:
  dispatch-final-readiness:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Require fresh backend and release consumer evidence
        id: gates
        shell: bash
        run: |
          node --check tools/release-source-fingerprint.mjs
          node --check tools/final-readiness-orchestration-gate.mjs
          node tools/final-readiness-orchestration-gate.mjs

      - name: Dispatch final readiness
        if: steps.gates.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run final-readiness.yml --repo kaalflash12/naruto-shinobi-no-sho --ref main

      - name: Wait for remaining live gate
        if: steps.gates.outputs.ready != 'true'
        run: echo "FINAL_READINESS_WAITING live=${{ steps.gates.outputs.live }} release=${{ steps.gates.outputs.release }} account=${{ steps.gates.outputs.account }} gameplay=${{ steps.gates.outputs.gameplay }} same_backend=${{ steps.gates.outputs.same_backend }}"
