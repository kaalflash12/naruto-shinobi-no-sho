name: Portable Bootstrap Hardening Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden all portable tool resolvers
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re

          p = Path('tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "  [switch]$ValidateRunParsing\n)",
              "  [switch]$ValidateRunParsing,\n  [switch]$ValidatePortableTools\n)",
              1,
          )

          gh = r'''function Get-GhExecutable {
            $existing = Get-Command gh -ErrorAction SilentlyContinue
            if ($existing) { return $existing.Source }

            $cacheRoot = Join-Path $env:TEMP 'shinobi-gh-portable'
            $cached = Get-ChildItem $cacheRoot -Recurse -File -Filter gh.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cached) {
              Write-Host ("Reutilizando GitHub CLI portatil existente: {0}" -f $cached.FullName) -ForegroundColor Green
              return $cached.FullName
            }

            Write-Step 'Baixando GitHub CLI portatil'
            $root = Join-Path $env:TEMP ("shinobi-gh-portable-{0}" -f [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $root -Force | Out-Null
            $headers = @{ 'User-Agent' = 'naruto-shinobi-no-sho-bootstrap' }
            $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/cli/cli/releases/latest'
            $asset = @($release.assets | Where-Object { $_.name -match '^gh_.*_windows_amd64\.zip$' }) | Select-Object -First 1
            if (-not $asset) { throw 'Nao foi possivel localizar GitHub CLI Windows amd64.' }
            $zip = Join-Path $root 'gh.zip'
            Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $root -Force
            $gh = Get-ChildItem $root -Recurse -File -Filter gh.exe | Select-Object -First 1
            if (-not $gh) { throw 'gh.exe nao encontrado.' }
            return $gh.FullName
          }'''
          s, n = re.subn(r'function Get-GhExecutable \{.*?\n\}\n\nfunction Ensure-GhLogin', gh + '\n\nfunction Ensure-GhLogin', s, count=1, flags=re.S)
          assert n == 1, 'Get-GhExecutable nao localizado'

          npx = r'''function Get-NpxExecutable {
            $existing = Get-Command npx.cmd -ErrorAction SilentlyContinue
            if (-not $existing) { $existing = Get-Command npx -ErrorAction SilentlyContinue }
            if ($existing) { return $existing.Source }

            $cacheRoot = Join-Path $env:TEMP 'shinobi-node-portable'
            $cached = Get-ChildItem $cacheRoot -Recurse -File -Filter npx.cmd -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cached) {
              Write-Host ("Reutilizando Node.js portatil existente: {0}" -f $cached.FullName) -ForegroundColor Green
              return $cached.FullName
            }

            Write-Step 'Baixando Node.js LTS portatil'
            $root = Join-Path $env:TEMP ("shinobi-node-portable-{0}" -f [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $root -Force | Out-Null
            $index = Invoke-RestMethod -Uri 'https://nodejs.org/dist/index.json'
            $release = @($index | Where-Object { $_.version -like 'v24.*' -and $_.lts -and ($_.files -contains 'win-x64-zip') }) | Select-Object -First 1
            if (-not $release) { throw 'Node.js v24 LTS Windows x64 nao localizado.' }
            $base = "https://nodejs.org/dist/$($release.version)"
            $zipName = "node-$($release.version)-win-x64.zip"
            $zip = Join-Path $root $zipName
            $sums = Invoke-WebRequest -UseBasicParsing -Uri "$base/SHASUMS256.txt"
            $expectedLine = @($sums.Content -split "`n" | Where-Object { $_ -match [regex]::Escape($zipName) }) | Select-Object -First 1
            if (-not $expectedLine) { throw 'SHA256 oficial do Node.js nao localizado.' }
            $expected = (($expectedLine -split '\s+')[0]).Trim().ToLowerInvariant()
            Invoke-WebRequest -Uri "$base/$zipName" -OutFile $zip
            $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw 'SHA256 do Node.js portatil nao confere.' }
            Expand-Archive -Path $zip -DestinationPath $root -Force
            $npx = Get-ChildItem $root -Recurse -File -Filter npx.cmd | Select-Object -First 1
            if (-not $npx) { throw 'npx.cmd nao encontrado.' }
            return $npx.FullName
          }'''
          s, n = re.subn(r'function Get-NpxExecutable \{.*?\n\}\n\nfunction Clear-CloudflareEnvironment', npx + '\n\nfunction Clear-CloudflareEnvironment', s, count=1, flags=re.S)
          assert n == 1, 'Get-NpxExecutable nao localizado'

          atlas = r'''function Get-AtlasExecutable {
            $existing = Get-Command atlas.exe -ErrorAction SilentlyContinue
            if (-not $existing) { $existing = Get-Command atlas -ErrorAction SilentlyContinue }
            if ($existing) { return $existing.Source }

            $cacheRoot = Join-Path $env:TEMP 'shinobi-atlas-portable'
            $cached = Get-ChildItem $cacheRoot -Recurse -File -Filter atlas.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cached) {
              Write-Host ("Reutilizando MongoDB Atlas CLI portatil existente: {0}" -f $cached.FullName) -ForegroundColor Green
              return $cached.FullName
            }

            Write-Step 'Baixando MongoDB Atlas CLI portatil'
            $root = Join-Path $env:TEMP ("shinobi-atlas-portable-{0}" -f [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $root -Force | Out-Null
            $headers = @{ 'User-Agent' = 'naruto-shinobi-no-sho-bootstrap' }
            $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/mongodb/mongodb-atlas-cli/releases/latest'
            $asset = @($release.assets | Where-Object { $_.name -match '^mongodb-atlas-cli_.*_windows_x86_64\.zip$' }) | Select-Object -First 1
            if (-not $asset) { throw 'Atlas CLI Windows x86_64 nao localizado.' }
            $zip = Join-Path $root $asset.name
            Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $zip
            if ([string]$asset.digest -match '^sha256:([a-fA-F0-9]{64})$') {
              $expected = $Matches[1].ToLowerInvariant()
              $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
              if ($actual -ne $expected) { throw 'SHA256 do Atlas CLI nao confere.' }
            }
            Expand-Archive -Path $zip -DestinationPath $root -Force
            $atlas = Get-ChildItem $root -Recurse -File -Filter atlas.exe | Select-Object -First 1
            if (-not $atlas) { throw 'atlas.exe nao encontrado.' }
            return $atlas.FullName
          }'''
          s, n = re.subn(r'function Get-AtlasExecutable \{.*?\n\}\n\nfunction Test-AtlasAuthenticated', atlas + '\n\nfunction Test-AtlasAuthenticated', s, count=1, flags=re.S)
          assert n == 1, 'Get-AtlasExecutable nao localizado'

          validation = r'''
          if ($ValidatePortableTools) {
            $savedPath = $env:PATH
            $root = Join-Path $env:TEMP ("shinobi-portable-lock-fixture-{0}" -f [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $root -Force | Out-Null
            $savedTemp = $env:TEMP
            $locks = @()
            try {
              $env:TEMP = $root
              $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
              $fixtures = @(
                @{ Dir = 'shinobi-gh-portable\bin'; Name = 'gh.exe'; Resolver = 'gh' },
                @{ Dir = 'shinobi-node-portable\bin'; Name = 'npx.cmd'; Resolver = 'npx' },
                @{ Dir = 'shinobi-atlas-portable\bin'; Name = 'atlas.exe'; Resolver = 'atlas' }
              )
              foreach ($f in $fixtures) {
                $dir = Join-Path $root $f.Dir
                New-Item -ItemType Directory -Path $dir -Force | Out-Null
                $file = Join-Path $dir $f.Name
                [IO.File]::WriteAllText($file, 'locked-fixture')
                $locks += [IO.File]::Open($file, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::None)
              }
              $ghFixture = Get-GhExecutable
              $npxFixture = Get-NpxExecutable
              $atlasFixture = Get-AtlasExecutable
              if ((Split-Path $ghFixture -Leaf) -ne 'gh.exe') { throw 'Fixture GitHub CLI nao foi reutilizada.' }
              if ((Split-Path $npxFixture -Leaf) -ne 'npx.cmd') { throw 'Fixture Node.js nao foi reutilizada.' }
              if ((Split-Path $atlasFixture -Leaf) -ne 'atlas.exe') { throw 'Fixture Atlas CLI nao foi reutilizada.' }

              $source = Get-Content $PSCommandPath -Raw
              foreach ($prefix in @('shinobi-gh-portable','shinobi-node-portable','shinobi-atlas-portable')) {
                $unsafe = "Join-Path `$env:TEMP '$prefix'`r`n  if (Test-Path `$root) { Remove-Item `$root -Recurse -Force }"
                if ($source.Contains($unsafe)) { throw "Regressao: remocao destrutiva voltou para $prefix." }
              }
              Write-Host 'PASS_PORTABLE_TOOL_LOCK_REUSE'
              exit 0
            } finally {
              foreach ($lock in $locks) { if ($lock) { $lock.Dispose() } }
              $env:TEMP = $savedTemp
              $env:PATH = $savedPath
              Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          '''
          marker = 'if ($ValidateRunParsing) {'
          assert marker in s, 'bloco ValidateRunParsing nao localizado'
          s = s.replace(marker, validation + marker, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

          wf = Path('.github/workflows/canonical-v3-hardening.yml')
          w = wf.read_text(encoding='utf-8')
          step_marker = '      - name: Verify root launcher executes canonical V3 directly\n'
          assert step_marker in w, 'step permanente do launcher nao localizado'
          locked_step = '''      - name: Reproduce locked portable tools on Windows\n        shell: powershell\n        run: |\n          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1 -ValidatePortableTools\n\n'''
          if 'Reproduce locked portable tools on Windows' not in w:
              w = w.replace(step_marker, locked_step + step_marker, 1)
          wf.write_text(w, encoding='utf-8', newline='\n')
          '@ | python -

      - name: Parse patched PowerShell
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){ $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'PASS_PATCHED_V3_PARSE'

      - name: Reproduce locked portable tools before commit
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1 -ValidatePortableTools
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Preserve all existing V3 regression gates
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1 -ValidateRunParsing
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Commit hardened canonical V3 and remove one-shot
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/portable-bootstrap-hardening-once.yml
          git add tools/ATIVAR-CLOUDFLARE-LIVE-V3.ps1 .github/workflows/canonical-v3-hardening.yml
          git commit -m 'fix: make all portable bootstrap tools lock-safe'
          git push origin HEAD:main
