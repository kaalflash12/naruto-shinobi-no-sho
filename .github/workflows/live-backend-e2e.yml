name: Live Backend E2E - Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'r41-api-config.js'
      - 'r41-github-api.js'
      - 'tools/supabase-live-e2e.mjs'
      - '.github/workflows/live-backend-e2e.yml'

permissions:
  contents: write

concurrency:
  group: shinobi-live-supabase-e2e
  cancel-in-progress: false

jobs:
  live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax gate
        run: |
          node --check tools/supabase-live-e2e.mjs
          node --check r41-api-config.js
          node --check r41-github-api.js

      - name: Run Supabase Postgres + Edge Function live E2E
        id: live
        continue-on-error: true
        env:
          API_ORIGIN: https://rlyiwlwzrdgvcwawrnpl.supabase.co/functions/v1/shinobi-api
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_S9LtSpLhLKFOU9iSd8b4yQ_EziH1Arr
          LIVE_BACKEND_REPORT: audit/LIVE-BACKEND.json
          ACCOUNT_REPORT: audit/ACCOUNT-LIVE-E2E.json
        run: node tools/supabase-live-e2e.mjs

      - name: Commit live evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f audit/LIVE-BACKEND.json
          test -f audit/ACCOUNT-LIVE-E2E.json
          live="$(node -e "const r=require('./audit/LIVE-BACKEND.json');process.stdout.write(r.status||'UNKNOWN')")"
          account="$(node -e "const r=require('./audit/ACCOUNT-LIVE-E2E.json');process.stdout.write(r.status||'UNKNOWN')")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/LIVE-BACKEND.json audit/ACCOUNT-LIVE-E2E.json
          if ! git diff --cached --quiet; then
            git commit -m "test: Supabase live ${live} ${account}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-supabase-live-evidence
          path: |
            audit/LIVE-BACKEND.json
            audit/ACCOUNT-LIVE-E2E.json
          if-no-files-found: warn

      - name: Enforce live backend PASS
        if: always()
        run: |
          node - <<'NODE'
          const live=require('./audit/LIVE-BACKEND.json');
          const account=require('./audit/ACCOUNT-LIVE-E2E.json');
          if(!live.ok||live.status!=='PASS_LIVE_BACKEND_E2E')throw new Error(JSON.stringify(live.failures||[]));
          if(live.backend!=='supabase-edge-postgres')throw new Error('backend live não é Supabase');
          if(!account.ok||account.status!=='PASS_ACCOUNT_LIVE_E2E')throw new Error(JSON.stringify(account.failures||[]));
          console.log(live.status,account.status);
          NODE
