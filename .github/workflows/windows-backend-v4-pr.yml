name: Windows Backend V4 PR Exact Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-backend-v4-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact V4 payload
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $b64 = @'

'@
          $gzPath = Join-Path $env:RUNNER_TEMP "backend-v4.ps1.gz"
          $ps1Path = Join-Path $env:RUNNER_TEMP "ATIVAR_BACKEND_SHINOBI_SEM_INSTALAR_NADA_V4.ps1"
          [IO.File]::WriteAllBytes($gzPath, [Convert]::FromBase64String(($b64 -replace '\s','')))
          $input = [IO.File]::OpenRead($gzPath)
          try {
            $gzip = New-Object IO.Compression.GZipStream($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($ps1Path)
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }
          $sha = (Get-FileHash -LiteralPath $ps1Path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "ae95c5650441f6ce4e763eee821ad512fa48a9e0d551f8db2267904f05c1abe0") {
            throw "SHA V4 divergente: $sha"
          }
          "V4_PATH=$ps1Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          Write-Host "[PASS] Exact V4 SHA256: $sha"

      - name: Windows PowerShell 5.1 parser gate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "PSEdition=$($PSVersionTable.PSEdition)"
          Write-Host "PSVersion=$($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSEdition -ne "Desktop") {
            throw "Runner nao esta usando Windows PowerShell Desktop."
          }
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Esperado Windows PowerShell 5.x."
          }
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $env:V4_PATH,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host ("Linha {0}, coluna {1}: {2}" -f $_.Extent.StartLineNumber,$_.Extent.StartColumnNumber,$_.Message)
            }
            throw "Parser encontrou $($errors.Count) erro(s)."
          }
          Write-Host "[PASS] Windows PowerShell 5.1 parser: 0 erros"

      - name: Execute exact V4 preflight on Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $env:V4_PATH -PreflightOnly
          $code=$LASTEXITCODE
          if ($code -ne 0) {
            throw "V4 preflight terminou com exit $code"
          }
          Write-Host "[PASS] Exact V4 PreflightOnly terminou exit 0"
