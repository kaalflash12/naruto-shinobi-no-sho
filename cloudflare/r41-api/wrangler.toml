name = "naruto-shinobi-no-sho-api"
main = "src/entry-authoritative.js"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat", "no_throw_on_not_implemented_tls_options"]

[vars]
MONGODB_DB = "naruto_shinobi_no_sho"
ALLOWED_ORIGINS = "https://kaalflash12.github.io,https://naruto-shinobi-no-sho.pages.dev"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[exports.GameRoom]
type = "durable-object"
storage = "sqlite"
